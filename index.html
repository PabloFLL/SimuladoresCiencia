eventDefault();const target=document.getElementById(decodeURIComponent(raw.slice(1)));if(target)target.scrollIntoView();return;}\n  if(/^(https?:|mailto:|data:|blob:)/i.test(raw))return;\n  const url=new URL(raw,document.baseURI),page=url.pathname.split('/').pop();\n  if(![\"index.html\", \"gay-lussac.html\", \"leyes-gases.html\", \"gases-ideales.html\", \"particulas-2d.html\", \"particulas-3d.html\", \"charles.html\", \"boyle-mariotte.html\"].includes(page))return;\n  event.preventDefault();window.parent.postMessage({labBundle:true,action:'navigate',page,section:url.hash.slice(1)},'*');\n },true);\n})();\n\u003c/script>\u003c/head>\n\u003cbody>\n\u003cmain class=\"shell\">\n\u003cheader class=\"topbar\">\u003cdiv class=\"brand\">\u003cspan class=\"brandmark\" aria-hidden=\"true\">\u003c/span>LABORATORIO DE PARTÍCULAS\u003c/div>\u003cdiv class=\"top-actions\">\u003ca class=\"textbutton\" href=\"index.html\">← Laboratorio\u003c/a>\u003cspan class=\"smalltag\">Modelo geométrico · 3D\u003c/span>\u003cbutton class=\"textbutton\" id=\"download\">↓ Descargar HTML\u003c/button>\u003cbutton class=\"textbutton\" id=\"fullscreen\" title=\"Pantalla completa\" aria-label=\"Pantalla completa\">⛶\u003c/button>\u003c/div>\u003c/header>\n\u003cnav class=\"mode-nav\" aria-label=\"Dimensión del simulador\">\u003ca href=\"particulas-2d.html\">← 2D · Área barrida\u003c/a>\u003ca href=\"particulas-3d.html\" aria-current=\"page\">3D · Volumen barrido\u003c/a>\u003c/nav>\n\u003csection class=\"hero\">\u003cdiv>\u003cdiv class=\"smalltag\">Tamaño · movimiento · espacio\u003c/div>\u003ch1>Mismo espacio.\u003cbr>Distinto ritmo.\u003c/h1>\u003cp>Explora el mismo experimento en tres dimensiones. Las esferas barren volumen: ahora la compensación depende del diámetro al cuadrado.\u003c/p>\u003c/div>\u003cdiv class=\"equation\">\u003cdiv class=\"formula\">V ≈ N · π(d/2)² · v · t\u003c/div>\u003csmall id=\"formulaCaption\">Barrido de avance · contando repeticiones\u003c/small>\u003c/div>\u003c/section>\n\u003csection class=\"toolbar\" aria-label=\"Configuración del experimento\">\u003cdiv class=\"presets\">\u003cbutton class=\"preset\" data-preset=\"equal\" aria-pressed=\"true\">01 · Mismo barrido\u003c/button>\u003cbutton class=\"preset\" data-preset=\"speed\" aria-pressed=\"false\">02 · Misma velocidad\u003c/button>\u003cbutton class=\"preset\" data-preset=\"size\" aria-pressed=\"false\">03 · Mismo tamaño\u003c/button>\u003c/div>\u003cdiv class=\"global\">\u003clabel for=\"count\">Partículas por caja \u003cselect id=\"count\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption selected>3\u003c/option>\u003coption>4\u003c/option>\u003coption>6\u003c/option>\u003c/select>\u003c/label>\u003clabel for=\"box\">Caja \u003cselect id=\"box\">\u003coption value=\"240\">240 × 160 × 160 u\u003c/option>\u003coption value=\"360\" selected>360 × 240 × 240 u\u003c/option>\u003coption value=\"480\">480 × 320 × 320 u\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003c/section>\n\u003cdiv class=\"camera-bar\">\u003cspan>↔ Arrastra una caja para girar ambas vistas · rueda para acercar\u003c/span>\u003cdiv>\u003cbutton id=\"zoomOut\" aria-label=\"Alejar\">−\u003c/button>\u003cbutton id=\"zoomIn\" aria-label=\"Acercar\">+\u003c/button>\u003cbutton id=\"cameraReset\">Restablecer vista\u003c/button>\u003c/div>\u003c/div>\n\u003csection class=\"panels\" aria-label=\"Comparación simultánea de dos cajas\">\n\u003carticle class=\"panel a\">\u003cdiv class=\"panel-head\">\u003cdiv class=\"panel-title\">\u003cspan class=\"badge\">A\u003c/span>Partículas A\u003c/div>\u003csmall id=\"rateA\">Barrido: 61.073 u³/s\u003c/small>\u003c/div>\u003cdiv class=\"stage\">\u003cspan class=\"stage-note\">Volumen visitado · proyección 3D\u003c/span>\u003ccanvas class=\"scene\" id=\"canvasA\" width=\"720\" height=\"450\" role=\"img\" aria-label=\"Caja A: esferas en un espacio tridimensional. Arrastra para girar la vista.\">\u003c/canvas>\u003cspan class=\"axis-label box-dims\">360 × 240 × 240 u\u003c/span>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"dA\">Diámetro \u003coutput id=\"dAo\">12 \u003csmall>u\u003c/small>\u003c/output>\u003c/label>\u003cinput id=\"dA\" type=\"range\" min=\"6\" max=\"36\" step=\"1\" value=\"12\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"vA\">Velocidad inicial \u003coutput id=\"vAo\">180 \u003csmall>u/s\u003c/small>\u003c/output>\u003c/label>\u003cinput id=\"vA\" type=\"range\" min=\"10\" max=\"240\" step=\"5\" value=\"180\">\u003c/div>\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv>\u003cdiv class=\"metric-name\">Volumen barrido · con repeticiones\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"sweptA\">0\u003c/span> \u003csmall>u³\u003c/small>\u003c/div>\u003cdiv class=\"reference-line\">Sin choques: \u003cspan id=\"referenceA\">0\u003c/span> u³ · Choques: \u003cspan id=\"hitsA\">0\u003c/span>\u003c/div>\u003cdiv class=\"reference-line\">Energía cinética: \u003cspan id=\"energyA\">100,0\u003c/span> % de la inicial\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"metric-name\">Volumen visitado · sin repetir ≈\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"coveredA\">0,0\u003c/span> \u003csmall>% de la caja\u003c/small>\u003c/div>\u003cdiv class=\"meter\">\u003cspan id=\"meterA\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\n\u003carticle class=\"panel b\">\u003cdiv class=\"panel-head\">\u003cdiv class=\"panel-title\">\u003cspan class=\"badge\">B\u003c/span>Partículas B\u003c/div>\u003csmall id=\"rateB\">Barrido: 61.073 u³/s\u003c/small>\u003c/div>\u003cdiv class=\"stage\">\u003cspan class=\"stage-note\">Volumen visitado · proyección 3D\u003c/span>\u003ccanvas class=\"scene\" id=\"canvasB\" width=\"720\" height=\"450\" role=\"img\" aria-label=\"Caja B: esferas en un espacio tridimensional. Arrastra para girar la vista.\">\u003c/canvas>\u003cspan class=\"axis-label box-dims\">360 × 240 × 240 u\u003c/span>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv class=\"control\">\u003clabel for=\"dB\">Diámetro \u003coutput id=\"dBo\">36 \u003csmall>u\u003c/small>\u003c/output>\u003c/label>\u003cinput id=\"dB\" type=\"range\" min=\"6\" max=\"36\" step=\"1\" value=\"36\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"vB\">Velocidad inicial \u003coutput id=\"vBo\">20 \u003csmall>u/s\u003c/small>\u003c/output>\u003c/label>\u003cinput id=\"vB\" type=\"range\" min=\"0.1\" max=\"240\" step=\"any\" value=\"20\">\u003c/div>\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv>\u003cdiv class=\"metric-name\">Volumen barrido · con repeticiones\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"sweptB\">0\u003c/span> \u003csmall>u³\u003c/small>\u003c/div>\u003cdiv class=\"reference-line\">Sin choques: \u003cspan id=\"referenceB\">0\u003c/span> u³ · Choques: \u003cspan id=\"hitsB\">0\u003c/span>\u003c/div>\u003cdiv class=\"reference-line\">Energía cinética: \u003cspan id=\"energyB\">100,0\u003c/span> % de la inicial\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"metric-name\">Volumen visitado · sin repetir ≈\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"coveredB\">0,0\u003c/span> \u003csmall>% de la caja\u003c/small>\u003c/div>\u003cdiv class=\"meter\">\u003cspan id=\"meterB\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\n\u003c/section>\n\u003cdiv class=\"below-panels\">\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"balance\" checked>Compensar velocidades iniciales: d\u003csub>A\u003c/sub>² · v\u003csub>A\u003c/sub> = d\u003csub>B\u003c/sub>² · v\u003csub>B\u003c/sub>\u003c/label>\u003cdiv style=\"display:flex;gap:20px\">\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"trail\" checked>Ver huella\u003c/label>\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"collisions\" checked>Choques elásticos\u003c/label>\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"arrows\" checked>Ver dirección\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"collision-settings\">\u003clabel for=\"collisionModel\">Modelo de choque \u003cselect id=\"collisionModel\">\u003coption value=\"exchange\" selected>Comparación exacta · didáctico\u003c/option>\u003coption value=\"smooth\">Esferas lisas · choque oblicuo\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"randomize\" title=\"Sortea direcciones nuevas y reinicia ambas cajas\">↻ Nuevas direcciones\u003c/button>\u003cspan>Reiniciar repite las mismas direcciones en ambas cajas.\u003c/span>\u003c/div>\n\u003cp class=\"collision-note\" id=\"collisionNote\">Los choques redistribuyen las velocidades. El barrido real se calcula con el recorrido de cada partícula; «Sin choques» muestra la referencia inicial. Desactiva los choques para recuperar la comparación original.\u003c/p>\n\u003csection class=\"transport\" aria-label=\"Reproducción\">\u003cdiv class=\"transport-left\">\u003cbutton class=\"primary\" id=\"play\">▶ Iniciar\u003c/button>\u003cbutton id=\"step\" title=\"Avanzar un segundo simulado\">+1 s\u003c/button>\u003cbutton id=\"reset\">↺ Reiniciar\u003c/button>\u003c/div>\u003cdiv class=\"time-info\">\u003cdiv class=\"clock\">\u003cspan id=\"time\">0,0\u003c/span> \u003csmall>s\u003c/small>\u003c/div>\u003cdiv class=\"time-track\" role=\"progressbar\" aria-label=\"Tiempo del experimento\" aria-valuemin=\"0\" aria-valuemax=\"20\" aria-valuenow=\"0\" id=\"timeProgress\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\u003clabel class=\"duration\" for=\"duration\">Duración \u003cselect id=\"duration\">\u003coption value=\"10\">10 s\u003c/option>\u003coption value=\"20\" selected>20 s\u003c/option>\u003coption value=\"40\">40 s\u003c/option>\u003coption value=\"60\">60 s\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class=\"duration\" for=\"playback\">Reproducción \u003cselect id=\"playback\">\u003coption value=\"0.5\">×0,5\u003c/option>\u003coption value=\"1\" selected>×1\u003c/option>\u003coption value=\"2\">×2\u003c/option>\u003c/select>\u003c/label>\u003c/section>\n\u003csection class=\"result\" aria-live=\"polite\" aria-atomic=\"true\">\u003cdiv>\u003ch2 id=\"resultTitle\">Mismo barrido por segundo\u003c/h2>\u003cp id=\"resultText\">A tiene 1/3 del diámetro de B y se mueve 9 veces más rápido.\u003c/p>\u003c/div>\u003cdiv class=\"ratio\">\u003csmall>Barrido real A / B\u003c/small>\u003cspan id=\"ratio\">1,00\u003c/span>×\u003c/div>\u003c/section>\n\u003csection class=\"physics-explainer\" aria-labelledby=\"physics-title\">\n\u003cdiv class=\"physics-intro\">\u003cspan class=\"smalltag\">Del modelo al gas real\u003c/span>\u003ch2 id=\"physics-title\">¿El diámetro fija la velocidad?\u003c/h2>\u003cp>\u003cstrong>No hay una rapidez fija para cada diámetro.\u003c/strong> En un gas en equilibrio térmico hay una distribución de rapideces (Maxwell-Boltzmann). Los choques las redistribuyen; a temperatura constante, la rapidez media se mantiene aproximadamente estable, con fluctuaciones.\u003c/p>\u003c/div>\n\u003cdiv class=\"physics-equations\">\n\u003carticle class=\"physics-equation\">\u003ch3>Temperatura y masa\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"La rapidez media es proporcional a la raíz cuadrada de la temperatura dividida por la masa\">\u003cmover>\u003cmi>v\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>∝\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmi>T\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/math>\u003cp>A igual temperatura, las partículas menos masivas se mueven más rápido \u003cstrong>en promedio\u003c/strong>.\u003c/p>\u003csmall>T: temperatura en kelvin · m: masa · v̄: rapidez media.\u003c/small>\u003c/article>\n\u003carticle class=\"physics-equation\">\u003ch3>Si son esferas de igual densidad\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"Masa proporcional al diámetro al cubo; a temperatura y densidad constantes, rapidez media proporcional al inverso del diámetro elevado a tres medios\">\u003cmi>m\u003c/mi>\u003cmo>∝\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>⇒\u003c/mo>\u003cmover>\u003cmi>v\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>∝\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmfrac>\u003cmn>3\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/msup>\u003c/mfrac>\u003c/math>\u003cp>Esta relación se deduce para \u003cstrong>esferas físicas en 3D\u003c/strong>, con la misma densidad y temperatura.\u003c/p>\u003csmall>No es una ley universal entre diámetro molecular y rapidez.\u003c/small>\u003c/article>\n\u003carticle class=\"physics-equation\">\u003ch3>¿Qué conservan los choques?\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"La energía cinética de una partícula es un medio de su masa por su rapidez al cuadrado\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003cp>Un choque elástico conserva la \u003cstrong>energía total del par\u003c/strong> y su cantidad de movimiento, aunque cambien las rapideces individuales.\u003c/p>\u003csmall>Conservar la energía no obliga a conservar la suma de rapideces ni el barrido.\u003c/small>\u003c/article>\n\u003c/div>\n\u003cp class=\"physics-model-note\">\u003cstrong>En este simulador:\u003c/strong> diámetro y rapidez inicial se eligen por separado; no se calcula una temperatura ni se vincula la masa al tamaño. «Comparación exacta» es una idealización elegida para igualar el barrido. «Esferas lisas» permite que las rapideces cambien con los choques. Las fórmulas anteriores son la referencia física, no relaciones impuestas por el programa.\u003c/p>\n\u003ca class=\"physics-source\" href=\"https://openstax.org/books/qu%C3%ADmica-2ed/pages/9-5-la-teoria-cinetico-molecular\" target=\"_blank\" rel=\"noopener noreferrer\">Fundamento: teoría cinético-molecular · OpenStax ↗\u003c/a>\n\u003c/section>\n\u003csection class=\"learning\">\u003cdiv class=\"learning-card\">\u003cstrong>En 3D cuenta la sección de la esfera\u003c/strong>\u003cp>Una esfera dibuja un tubo con sección circular: π(d/2)². Si su diámetro se divide entre 3, su sección se divide entre 9. Debe moverse 9 veces más rápido para barrer el mismo volumen por segundo.\u003c/p>\u003cdetails>\u003csummary>Ver el modelo y sus límites\u003c/summary>\u003cp>La referencia sin choques es N · π(d/2)² · v · t. Suma el avance de los tubos incluso si vuelven a pasar por el mismo lugar. En un trayecto recto aislado, añadiendo la esfera inicial, el volumen es π(d/2)² · v · t + 4π(d/2)³/3.\u003c/p>\u003cp>El volumen visitado estima la unión de las huellas con celdas cúbicas de 1 u de lado: una celda cuenta si su centro ha sido alcanzado. Incluye las esferas iniciales. La medida es aproximada, especialmente con diámetros pequeños.\u003c/p>\u003cp>Las dos cajas comparten posiciones y direcciones aleatorias iniciales de sus centros. «Nuevas direcciones» sortea otro conjunto; «Reiniciar» repite el actual. Las partículas rebotan en las paredes y, con la opción activada, chocan elásticamente entre ellas. En cada caja tienen igual masa. Ambos modelos conservan la energía cinética y la cantidad de movimiento del par. En «Comparación exacta» se intercambian los vectores de velocidad completos: la suma de rapideces se mantiene y el barrido coincide con la fórmula. Es una idealización didáctica y no representa el choque oblicuo general de esferas lisas. En «Esferas lisas» se intercambia solo la componente normal al contacto: las rapideces pueden redistribuirse y el barrido puede diferir sin pérdida de energía. El barrido mostrado siempre suma los recorridos efectivamente realizados. La referencia usa las rapideces iniciales constantes. La vista es una proyección ortográfica del movimiento tridimensional. Los cruces en pantalla pueden corresponder a trayectorias a distinta profundidad.\u003c/p>\u003cp>Es un modelo geométrico con unidades arbitrarias; no impone una relación física entre el tamaño de una molécula y su velocidad.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"learning-card\">\u003cstrong>Conecta el plano con el espacio\u003c/strong>\u003cp>1. En «Comparación exacta», inicia «Mismo barrido»: diámetro 3 veces menor, velocidad 9 veces mayor, incluso con choques.\u003cbr>2. Prueba «Misma velocidad»: la esfera grande barre 9 veces más volumen.\u003cbr>3. Prueba «Esferas lisas» y observa la energía. Gira la caja: un cruce en pantalla puede estar a distinta profundidad.\u003c/p>\u003cp style=\"margin-top:9px\">El volumen barrido cuenta repeticiones. El volumen visitado solo cuenta una vez cada zona de la caja: por eso no tiene por qué coincidir entre A y B.\u003c/p>\u003cp style=\"margin-top:9px\">Al cambiar tamaño, velocidad, cantidad o caja, el experimento vuelve al inicio. La rotación y el zoom solo cambian la vista.\u003c/p>\u003c/div>\u003c/section>\n\u003cfooter>\u003cspan>Laboratorio de partículas · Modelo didáctico tridimensional\u003c/span>\u003cspan>u = unidad de longitud · u³ = unidad de volumen\u003c/span>\u003c/footer>\n\u003c/main>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>\n'use strict';\nconst initialHTML='\u003c!doctype html>\\n'+document.documentElement.outerHTML;\nconst $=id=>document.getElementById(id);\nconst fmt=(n,d=0)=>n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst state={width:360,height:240,depth:240,count:3,dA:12,dB:36,vA:180,vB:20,t:0,duration:20,running:false,locked:true,showTrail:true,arrows:true,playback:1,collisions:true,collisionModel:'exchange',seed:Math.floor(Math.random()*4294967296)};\nconst camera={yaw:-.62,pitch:.38,zoom:1},panels={};let last=0,accumulator=0,toastTimer;\nfunction seeded(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}\nfunction rate(k){return state.count*Math.PI*(state['d'+k]/2)**2*state['v'+k];}\n/* PHYSICS_START */\n// Equal-mass hard disks/spheres. Events are solved in continuous time so fast\n// particles cannot jump through one another between rendered frames.\nfunction syncParticle(p,axes){\n p.speed=Math.hypot(...axes.map(a=>p['v'+a]));\n for(const a of axes)p['d'+a]=p.speed>1e-12?p['v'+a]/p.speed:0;\n}\nfunction advanceParticles(particles,dt,r,dims,collisions,onSegment,onCollision=()=>{},model='smooth'){\n const axes=['x','y','z'].slice(0,dims.length),diameter=2*r,contactTolerance=1e-6;\n let remaining=dt,iterations=0;\n for(const p of particles)syncParticle(p,axes);\n while(remaining>1e-12){\n  if(++iterations>10000)throw Error('Too many contact events in one step');\n  let eventTime=remaining,hasEvent=false;\n  for(const p of particles)for(let axis=0;axis\u003caxes.length;axis++){\n   const a=axes[axis],v=p['v'+a];if(Math.abs(v)\u003c1e-12)continue;\n   const t=((v>0?dims[axis]-r:r)-p[a])/v;\n   if(t>=-1e-10&&t\u003c=eventTime){eventTime=Math.max(0,t);hasEvent=true;}\n  }\n  if(collisions)for(let i=0;i\u003cparticles.length;i++)for(let j=i+1;j\u003cparticles.length;j++){\n   const p=particles[i],q=particles[j];let aa=0,b=0,c=-diameter*diameter;\n   for(const a of axes){const delta=q[a]-p[a],v=q['v'+a]-p['v'+a];aa+=v*v;b+=delta*v;c+=delta*delta;}\n   if(aa\u003c1e-18||b>=-1e-9)continue;\n   const discriminant=b*b-aa*c;if(discriminant\u003c=0)continue;\n   // Stable near-contact form of the smaller quadratic root.\n   const t=Math.max(0,c)/(-b+Math.sqrt(discriminant));\n   if(t\u003c=eventTime){eventTime=t;hasEvent=true;}\n  }\n  if(eventTime>0){\n   for(const p of particles){const start={};for(const a of axes){start[a]=p[a];p[a]+=p['v'+a]*eventTime;}onSegment(p,start,Object.fromEntries(axes.map(a=>[a,p[a]])),p.speed*eventTime);}\n   remaining=Math.max(0,remaining-eventTime);\n  }\n  if(!hasEvent)break;\n  let resolved=false;\n  // Sequential impulses also handle a wall and a pair contact at the same time.\n  for(let pass=0;pass\u003c12;pass++){\n   let changed=false;\n   for(const p of particles)for(let axis=0;axis\u003caxes.length;axis++){\n    const a=axes[axis],v='v'+a;\n    if((p[a]\u003c=r+contactTolerance&&p[v]\u003c0)||(p[a]>=dims[axis]-r-contactTolerance&&p[v]>0)){p[v]=-p[v];changed=resolved=true;}\n    p[a]=Math.max(r,Math.min(dims[axis]-r,p[a]));\n   }\n   if(collisions)for(let i=0;i\u003cparticles.length;i++)for(let j=i+1;j\u003cparticles.length;j++){\n    const p=particles[i],q=particles[j],delta=axes.map(a=>q[a]-p[a]),distance=Math.hypot(...delta);\n    if(distance>diameter+contactTolerance||distance\u003c1e-12)continue;\n    const normal=delta.map(v=>v/distance);let relative=0;\n    for(let axis=0;axis\u003caxes.length;axis++){const a=axes[axis];relative+=(q['v'+a]-p['v'+a])*normal[axis];}\n    if(relative>=-1e-9)continue;\n    if(model==='exchange'){\n     // Didactic exchange rule: conserves linear momentum, kinetic energy and\n     // the set of speeds. It is not a general smooth-sphere oblique impulse.\n     for(const a of axes){const v=p['v'+a];p['v'+a]=q['v'+a];q['v'+a]=v;}\n    }else{\n     for(let axis=0;axis\u003caxes.length;axis++){const a=axes[axis],impulse=relative*normal[axis];p['v'+a]+=impulse;q['v'+a]-=impulse;}\n    }\n    changed=resolved=true;onCollision(p,q);\n   }\n   if(!changed)break;\n  }\n  for(const p of particles)syncParticle(p,axes);\n  if(!resolved&&eventTime===0)throw Error('Unresolved particle contact');\n }\n}\n/* PHYSICS_END */\nfunction visitCapsule(panel,a,b,r){\n const g=panel.grid,h=g.cell,rr=r*r,dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,len=dx*dx+dy*dy+dz*dz;\n const low=[a.x,a.y,a.z].map((v,i)=>Math.max(0,Math.floor((Math.min(v,[b.x,b.y,b.z][i])-r)/h)));\n const high=[a.x,a.y,a.z].map((v,i)=>Math.min([g.nx,g.ny,g.nz][i]-1,Math.floor((Math.max(v,[b.x,b.y,b.z][i])+r)/h)));\n for(let z=low[2];z\u003c=high[2];z++)for(let y=low[1];y\u003c=high[1];y++){\n  const base=(z*g.ny+y)*g.nx,py=(y+.5)*h-a.y,pz=(z+.5)*h-a.z;\n  for(let x=low[0];x\u003c=high[0];x++){\n   const idx=base+x,byte=idx>>>3,bit=1\u003c\u003c(idx&7);if(g.data[byte]&bit)continue;\n   const px=(x+.5)*h-a.x;let s=len?(px*dx+py*dy+pz*dz)/len:0;if(s\u003c0)s=0;else if(s>1)s=1;\n   const ex=px-s*dx,ey=py-s*dy,ez=pz-s*dz;\n   if(ex*ex+ey*ey+ez*ez\u003c=rr+1e-9){g.data[byte]|=bit;g.visited++;}\n  }\n }\n}\nfunction configurePanel(k){\n const canvas=$('canvas'+k),cell=1,nx=state.width/cell,ny=state.height/cell,nz=state.depth/cell;\n const rnd=seeded(state.seed),positions=[[.32,.5,.5],[.68,.5,.5],[.78,.27,.58],[.31,.77,.3],[.65,.41,.23],[.85,.78,.72]],particles=[];\n for(let i=0;i\u003cstate.count;i++){const theta=rnd()*2*Math.PI,z=rnd()*2-1,h=Math.sqrt(1-z*z);particles.push({x:positions[i][0]*state.width,y:positions[i][1]*state.height,z:positions[i][2]*state.depth,dx:Math.cos(theta)*h,dy:Math.sin(theta)*h,dz:z,paths:[]});}\n const p=panels[k]={canvas,ctx:canvas.getContext('2d'),particles,color:k==='A'?'#53dfbe':'#ffb77e',swept:0,collisionCount:0,grid:{cell,nx,ny,nz,total:nx*ny*nz,data:new Uint8Array(Math.ceil(nx*ny*nz/8)),visited:0}};\n for(const q of particles){q.vx=q.dx*state['v'+k];q.vy=q.dy*state['v'+k];q.vz=q.dz*state['v'+k];syncParticle(q,['x','y','z']);}\n for(const q of particles)visitCapsule(p,q,q,state['d'+k]/2);\n}\nfunction addPath(q,a,b){\n const old=q.paths[q.paths.length-1];\n if(old){const ux=old.b.x-old.a.x,uy=old.b.y-old.a.y,uz=old.b.z-old.a.z,vx=b.x-a.x,vy=b.y-a.y,vz=b.z-a.z,n=Math.hypot(ux,uy,uz)*Math.hypot(vx,vy,vz);if(n>0&&(ux*vx+uy*vy+uz*vz)/n>1-1e-9){old.b=b;return;}}\n q.paths.push({a,b});\n}\nfunction compensate(){if(state.locked)state.vB=state.vA*(state.dA/state.dB)**2;}\nfunction reset(){state.t=0;state.running=false;accumulator=0;configurePanel('A');configurePanel('B');updateControls();updateNumbers();draw();}\nfunction tick(dt){\n const delta=Math.min(dt,Math.max(0,state.duration-state.t));if(delta\u003c=0)return;\n for(const k of ['A','B']){const p=panels[k],r=state['d'+k]/2;advanceParticles(p.particles,delta,r,[state.width,state.height,state.depth],state.collisions,(q,a,b,length)=>{p.swept+=Math.PI*r*r*length;visitCapsule(p,a,b,r);addPath(q,a,b);},()=>p.collisionCount++,state.collisionModel);}\n state.t=Math.min(state.duration,state.t+delta);\n if(state.t>=state.duration-1e-8){state.t=state.duration;state.running=false;updateControls();}\n}\nfunction rotated(p){const x=p.x-state.width/2,y=p.y-state.height/2,z=p.z-state.depth/2,cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw),cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch),xx=cy*x+sy*z,zz=-sy*x+cy*z;return {x:xx,y:cp*y-sp*zz,z:sp*y+cp*zz};}\nfunction projector(canvas){\n const dims=[state.width,state.height,state.depth],vertices=[];\n for(const x of [0,dims[0]])for(const y of [0,dims[1]])for(const z of [0,dims[2]])vertices.push(rotated({x,y,z}));\n const bw=Math.max(...vertices.map(v=>v.x))-Math.min(...vertices.map(v=>v.x)),bh=Math.max(...vertices.map(v=>v.y))-Math.min(...vertices.map(v=>v.y));\n const scale=Math.min(canvas.width*.78/bw,canvas.height*.76/bh)*camera.zoom;\n return {scale,point:p=>{const v=rotated(p);return {x:canvas.width*.5+v.x*scale,y:canvas.height*.51-v.y*scale,z:v.z};}};\n}\nfunction drawPanel(k){\n const p=panels[k],c=p.ctx,w=p.canvas.width,h=p.canvas.height,project=projector(p.canvas),pr=project.point,s=project.scale,r=state['d'+k]/2;\n c.clearRect(0,0,w,h);c.fillStyle='#132a31';c.fillRect(0,0,w,h);\n function line(a,b,color,width=1){const aa=pr(a),bb=pr(b);c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(aa.x,aa.y);c.lineTo(bb.x,bb.y);c.stroke();}\n // Three-dimensional grid on the lower face of the box.\n for(let x=0;x\u003c=state.width;x+=state.width/9)line({x,y:0,z:0},{x,y:0,z:state.depth},'#2b4349',.7);\n for(let z=0;z\u003c=state.depth;z+=state.depth/6)line({x:0,y:0,z},{x:state.width,y:0,z},'#2b4349',.7);\n const corners=[];for(let x=0;x\u003c=1;x++)for(let y=0;y\u003c=1;y++)for(let z=0;z\u003c=1;z++)corners.push({x:x*state.width,y:y*state.height,z:z*state.depth});\n const edges=[];for(let i=0;i\u003c8;i++)for(const step of [1,2,4])if((i&step)===0)edges.push([corners[i],corners[i|step]]);\n for(const [a,b]of edges)line(a,b,'#5b7982',1);\n const items=[];\n if(state.showTrail)for(const q of p.particles)for(const path of q.paths){const a=pr(path.a),b=pr(path.b);items.push({kind:'path',a,b,z:(a.z+b.z)/2});}\n for(const q of p.particles)items.push({kind:'sphere',q,at:pr(q),z:pr(q).z});\n items.sort((a,b)=>a.z-b.z);\n for(const item of items){\n  if(item.kind==='path'){c.strokeStyle=p.color;c.globalAlpha=.19;c.lineWidth=Math.max(1,2*r*s);c.lineCap='round';c.beginPath();c.moveTo(item.a.x,item.a.y);c.lineTo(item.b.x,item.b.y);c.stroke();c.globalAlpha=1;continue;}\n  const {q,at}=item,rr=Math.max(2,r*s);\n  if(state.arrows){const len=Math.min(75,Math.max(18,q.speed*.2)),end=pr({x:q.x+q.dx*(r+len),y:q.y+q.dy*(r+len),z:q.z+q.dz*(r+len)}),dx=end.x-at.x,dy=end.y-at.y,n=Math.hypot(dx,dy)||1;c.strokeStyle=p.color;c.globalAlpha=.7;c.lineWidth=1.4;c.beginPath();c.moveTo(at.x,at.y);c.lineTo(end.x,end.y);c.moveTo(end.x-dx/n*7-dy/n*4,end.y-dy/n*7+dx/n*4);c.lineTo(end.x,end.y);c.lineTo(end.x-dx/n*7+dy/n*4,end.y-dy/n*7-dx/n*4);c.stroke();c.globalAlpha=1;}\n  const grad=c.createRadialGradient(at.x-rr*.34,at.y-rr*.4,rr*.03,at.x,at.y,rr);grad.addColorStop(0,'#f2fff7');grad.addColorStop(.35,p.color);grad.addColorStop(1,k==='A'?'#137d72':'#a34f2c');c.fillStyle=grad;c.shadowColor=p.color;c.shadowBlur=10;c.beginPath();c.arc(at.x,at.y,rr,0,2*Math.PI);c.fill();c.shadowBlur=0;c.strokeStyle=p.color;c.lineWidth=.7;c.stroke();\n }\n for(const [a,b]of edges){if((pr(a).z+pr(b).z)/2>0)line(a,b,'#8eaaa996',1);}\n // Fixed axis compass follows the orientation of the view.\n const origin={x:state.width/2,y:state.height/2,z:state.depth/2},o=pr(origin),axes=[['x',{...origin,x:origin.x+40},'#8ab9ed'],['y',{...origin,y:origin.y+40},'#91d9ba'],['z',{...origin,z:origin.z+40},'#f5b985']];\n for(const [label,pt,color]of axes){const v=pr(pt),dx=(v.x-o.x)/s*.55,dy=(v.y-o.y)/s*.55;c.strokeStyle=color;c.lineWidth=1.5;c.beginPath();c.moveTo(39,h-34);c.lineTo(39+dx,h-34+dy);c.stroke();c.fillStyle=color;c.font='11px system-ui';c.fillText(label,39+dx+(dx>=0?4:-9),h-34+dy+4);}\n}\nfunction draw(){drawPanel('A');drawPanel('B');}\nfunction updateControls(){\n for(const k of ['A','B']){for(const type of ['d','v']){const val=state[type+k];if(type==='v'&&k==='B')$('vB').max=Math.max(240,Math.ceil(val));$(type+k).value=val;$(type+k+'o').innerHTML=fmt(val,Number.isInteger(val)?0:2)+' \u003csmall>'+(type==='d'?'u':'u/s')+'\u003c/small>';}$('rate'+k).textContent='Barrido: '+fmt(rate(k))+' u³/s';}\n $('collisions').checked=state.collisions;$('collisionNote').hidden=!state.collisions;$('collisionModel').value=state.collisionModel;$('collisionModel').disabled=!state.collisions;$('balance').checked=state.locked;$('play').textContent=state.running?'Ⅱ Pausar':state.t>=state.duration?'▶ Repetir':state.t>0?'▶ Continuar':'▶ Iniciar';$('step').disabled=state.running||state.t>=state.duration;\n document.querySelectorAll('.box-dims').forEach(x=>x.textContent=state.width+' × '+state.height+' × '+state.depth+' u');\n const ratio=rate('A')/rate('B');$('ratio').textContent=fmt(ratio,2);const eq=Math.abs(ratio-1)\u003c1e-8;\n $('resultTitle').textContent=(state.collisions&&state.collisionModel==='smooth'?'Referencia inicial: ':'')+(eq?'Mismo volumen barrido por segundo':ratio>1?'A barre más volumen por segundo':'B barre más volumen por segundo');\n if(eq){$('resultText').textContent=Math.abs(state.dB/state.dA-3)\u003c1e-8?'A tiene 1/3 del diámetro de B y se mueve 9 veces más rápido.':'Diámetro² × velocidad coincide en ambas cajas: dₐ² · vₐ = dᵦ² · vᵦ.';}\n else $('resultText').textContent='El barrido de '+(ratio>1?'A':'B')+' es '+fmt(ratio>1?ratio:1/ratio,2)+' veces el de '+(ratio>1?'B':'A')+'. Los solapamientos modifican el volumen visitado.';\n if(state ont-size:10px}.lab-grid{grid-template-columns:1fr;gap:14px}.scene{aspect-ratio:620/370}.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric strong{font-size:25px}.sliders.single{grid-template-columns:1fr;gap:12px}.sliders{gap:15px}.controls-panel{padding:14px}.controls-heading{align-items:flex-start;flex-wrap:wrap}.control label{font-size:11px;flex-direction:column;align-items:stretch;gap:6px;min-height:62px}.number-wrap{justify-content:flex-start}input[type=number]{width:77px}.quick-actions{align-items:center}.invariant{gap:12px;align-items:flex-start}.invariant h2{font-size:16px}.invariant p{font-size:11px}.invariant-value{font-size:20px}.table-heading{padding:13px;flex-wrap:wrap}.table-actions{width:100%}.table-actions button{flex:1}.explanation{grid-template-columns:1fr;gap:12px}.model-note{font-size:10px}footer{flex-direction:column;gap:3px}.panel-title h2{font-size:14px}.hero-formula math[display=block]{display:inline-flex}.graph-description{min-height:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n\n:root{--accent:#ad6131;--soft:#f3e8d9}\u003c/style>\u003cscript>\n(function(){\n if(window.parent===window)return;\n document.addEventListener('click',function(event){\n  const download=event.target.closest&&event.target.closest('#download');\n  if(download){event.preventDefault();event.stopImmediatePropagation();window.parent.postMessage({labBundle:true,action:'download'},'*');return;}\n  const anchor=event.target.closest&&event.target.closest('a[href]');\n  if(!anchor||anchor.hasAttribute('download'))return;\n  const raw=anchor.getAttribute('href');\n  if(!raw)return;\n  if(raw.startsWith('#')){event.preventDefault();const target=document.getElementById(decodeURIComponent(raw.slice(1)));if(target)target.scrollIntoView();return;}\n  if(/^(https?:|mailto:|data:|blob:)/i.test(raw))return;\n  const url=new URL(raw,document.baseURI),page=url.pathname.split('/').pop();\n  if(![\"index.html\", \"gay-lussac.html\", \"leyes-gases.html\", \"gases-ideales.html\", \"particulas-2d.html\", \"particulas-3d.html\", \"charles.html\", \"boyle-mariotte.html\"].includes(page))return;\n  event.preventDefault();window.parent.postMessage({labBundle:true,action:'navigate',page,section:url.hash.slice(1)},'*');\n },true);\n})();\n\u003c/script>\u003c/head>\n\u003cbody>\u003cmain class=\"shell\">\u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"index.html\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003c/span>LABORATORIO DE CIENCIAS\u003c/a>\u003cdiv class=\"top-actions\">\u003ca class=\"textbutton\" href=\"leyes-gases.html\">← Leyes de los gases\u003c/a>\u003cbutton class=\"textbutton\" id=\"download\">Descargar HTML ↓\u003c/button>\u003cbutton class=\"textbutton\" id=\"fullscreen\">Pantalla completa ⛶\u003c/button>\u003c/div>\u003c/header>\u003cnav class=\"law-nav\" aria-label=\"Simuladores de gases\">\u003ca href=\"boyle-mariotte.html\">Boyle-Mariotte\u003c/a>\u003ca href=\"charles.html\" aria-current=\"page\">Charles\u003c/a>\u003ca href=\"gay-lussac.html\">Gay-Lussac\u003c/a>\u003ca href=\"gases-ideales.html\">Gases ideales\u003c/a>\u003c/nav>\n\u003csection class=\"hero\">\u003cdiv>\u003cspan class=\"eyebrow\">Leyes de los gases · Experimento virtual\u003c/span>\u003ch1>Ley de Charles\u003c/h1>\u003cp>Calienta un gas bajo un pistón que puede moverse. Mantén la presión y observa cómo aumenta el volumen.\u003c/p>\u003c/div>\u003cdiv class=\"hero-formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmi>V\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003c/math>\u003csmall>Relación que vas a comprobar\u003c/small>\u003c/div>\u003c/section>\n\u003cdiv class=\"constants\">\u003cspan class=\"caption\">Se mantiene constante:\u003c/span>\u003cspan class=\"constant-chip\">P ≈ 1,0257 atm\u003c/span>\u003cspan class=\"constant-chip\">n = 0,250 mol\u003c/span>\u003c/div>\n\u003cdiv class=\"lab-grid\">\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>El gas en el recipiente\u003c/h2>\u003cspan>Vista esquemática\u003c/span>\u003c/div>\u003ccanvas class=\"scene\" id=\"gasScene\" width=\"620\" height=\"370\" role=\"img\" aria-label=\"Partículas del gas, recipiente y manómetro. Los valores numéricos se muestran debajo.\">\u003c/canvas>\u003cdiv class=\"scene-caption\">Los puntos son una muestra visual; el dibujo y sus velocidades no están a escala.\u003c/div>\u003cdiv class=\"scene-tools\">\u003cbutton id=\"pause\">Pausar partículas\u003c/button>\u003cspan class=\"small-notice\">Rapidez típica ∝ √T\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>La relación en una gráfica\u003c/h2>\u003cspan>Curva del modelo ideal\u003c/span>\u003c/div>\u003cdiv class=\"graph-wrap\">\u003csvg id=\"graph\" viewBox=\"0 0 620 330\" role=\"img\" aria-label=\"Gráfica de Ley de Charles\">\u003c/svg>\u003c/div>\u003cdiv class=\"graph-description\" id=\"graphDescription\">La recta muestra V = (nR/P)·T. Su prolongación hasta 0 K es matemática: un gas real cambia de fase antes de llegar allí.\u003c/div>\u003c/section>\u003c/div>\n\u003csection class=\"dashboard-metrics\" aria-label=\"Magnitudes del estado actual\">\u003cdiv class=\"metric\" id=\"metricP\">\u003cdiv class=\"metric-head\">Presión · P\u003cspan class=\"state-tag\" id=\"tagP\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueP\">\u003c/span> \u003csmall>atm\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Presión absoluta\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricV\">\u003cdiv class=\"metric-head\">Volumen · V\u003cspan class=\"state-tag\" id=\"tagV\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueV\">\u003c/span> \u003csmall>L\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Recipiente del estado\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricT\">\u003cdiv class=\"metric-head\">Temperatura · T\u003cspan class=\"state-tag\" id=\"tagT\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueT\">\u003c/span> \u003csmall>K\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">\u003cspan id=\"celsius\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricn\">\u003cdiv class=\"metric-head\">Cantidad de gas · n\u003cspan class=\"state-tag\" id=\"tagn\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valuen\">\u003c/span> \u003csmall>mol\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Cantidad de sustancia\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"controls-panel\" aria-label=\"Controles del experimento\">\u003cdiv class=\"controls-heading\">\u003cstrong>Modifica el estado del gas\u003c/strong>\u003cspan class=\"small-notice\">Cambia el control y observa el nuevo equilibrio.\u003c/span>\u003c/div>\u003cdiv class=\"sliders single\">\u003cdiv class=\"control\" id=\"controlT\">\u003clabel for=\"sliderT\">Temperatura \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputT\" aria-label=\"Temperatura en K\" min=\"0.000001\" step=\"any\"> K\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"sliderT\" aria-label=\"Ajustar temperatura\" step=\"any\">\u003csmall>Temperatura absoluta; 0 K no es admisible.\u003c/small>\u003c/div>\u003cdiv class=\"quick-actions\">\u003cbutton id=\"doubleT\">T × 2\u003c/button>\u003cbutton id=\"reset\">Reiniciar\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"invariant\">\u003cdiv>\u003ch2>V / T permanece constante\u003c/h2>\u003cp id=\"comparison\">\u003c/p>\u003c/div>\u003cdiv class=\"invariant-value\">\u003cspan id=\"invariantValue\">\u003c/span>\u003csmall>L/K\u003c/small>\u003c/div>\u003c/section>\n\u003csection class=\"table-section\">\u003cdiv class=\"table-heading\">\u003cdiv>\u003ch2>Cuaderno de estados\u003c/h2>\u003cp id=\"sampleCount\">\u003c/p>\u003c/div>\u003cdiv class=\"table-actions\">\u003cbutton class=\"primary\" id=\"saveState\">+ Registrar estado\u003c/button>\u003cbutton id=\"csv\">Descargar CSV ↓\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Estado\u003c/th>\u003cth scope=\"col\">P (atm)\u003c/th>\u003cth scope=\"col\">V (L)\u003c/th>\u003cth scope=\"col\">T (K)\u003c/th>\u003cth scope=\"col\">n (mol)\u003c/th>\u003cth scope=\"col\">V/T (L/K)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tableBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"explanation\">\u003cdiv>\u003ch2>¿Qué explica esta ley?\u003c/h2>\u003cp>A presión y cantidad de gas constantes, el volumen es directamente proporcional a la temperatura absoluta. Al calentar el gas, el pistón se desplaza y el gas ocupa más espacio hasta recuperar la presión impuesta.\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003cp>Usa siempre \u003cstrong>temperatura absoluta\u003c/strong>: T(K) = t(°C) + 273,15. La presión también es absoluta. En estas unidades, R = 0,082057366 L·atm/(mol·K).\u003c/p>\u003ca class=\"source\" href=\"https://openstax.org/books/qu%C3%ADmica-2ed/pages/9-2-relaciones-entre-presion-volumen-cantidad-y-temperatura-la-ley-de-los-gases-ideales\" target=\"_blank\" rel=\"noopener\">Referencia: OpenStax · Relaciones entre P, V, n y T ↗\u003c/a>\u003c/div>\u003cdiv>\u003ch2>Una prueba para hacer en clase\u003c/h2>\u003cp>Registra el estado inicial y duplica T. De 300 K a 600 K, el volumen pasa de 6 L a 12 L. Compara V/T en la tabla. La proporcionalidad se cumple con kelvin; duplicar los grados Celsius no duplica el volumen.\u003c/p>\u003cdetails>\u003csummary>Temperatura y movimiento de las partículas\u003c/summary>\u003cp>La temperatura determina la energía cinética media: ⟨E\u003csub>c\u003c/sub>⟩ = 3k\u003csub>B\u003c/sub>T/2. Las partículas no tienen todas la misma rapidez; para una masa dada, la rapidez cuadrática media crece como √T. Como referencia, para M = 28 g/mol, v\u003csub>rms\u003c/sub> = √(3RT/M) = \u003cstrong id=\"rms\">\u003c/strong> en el estado actual (aquí R = 8,314 J/(mol·K)).\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\u003cdiv class=\"model-note\">\u003cstrong>Cómo interpretar el modelo.\u003c/strong> Los valores y las curvas describen estados de equilibrio calculados con PV = nRT; no se obtienen contando los choques del dibujo. Se idealizan partículas puntuales y paredes elásticas. No se simulan los transitorios térmicos ni las interacciones de un gas real. El gas ideal es una aproximación útil a baja densidad, lejos de la condensación.\u003c/div>\n\u003cfooter>\u003ca href=\"index.html\">← Volver al laboratorio\u003c/a>\u003cspan>Leyes de los gases · Física y Química · Uso en clase y sin conexión\u003c/span>\u003c/footer>\u003c/main>\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>const LAW=\"charles\";const CONFIG={\"title\": \"Ley de Charles\", \"slug\": \"charles\", \"invariantCSV\": \"V_sobre_T_L_K\"};\n'use strict';\nconst GAS_R=0.08205736608096; // L atm mol^-1 K^-1\nconst GAS_DEFAULT=Object.freeze({V:6,T:300,n:0.25,P:0.25*GAS_R*300/6});\nfunction gasSolve(law,input={},dependent='P'){\n const s={...GAS_DEFAULT,...input};\n const positive=(v)=>Number.isFinite(v)&&v>0;\n if(law==='boyle'){s.T=GAS_DEFAULT.T;s.n=GAS_DEFAULT.n;if(!positive(s.V))throw Error('El volumen debe ser positivo.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='charles'){s.P=GAS_DEFAULT.P;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.V=s.n*GAS_R*s.T/s.P;}\n else if(law==='gay'){s.V=GAS_DEFAULT.V;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='ideal'){\n  if(!['P','V','T','n'].includes(dependent))throw Error('Magnitud desconocida.');\n  for(const k of ['P','V','T','n'])if(k!==dependent&&!positive(s[k]))throw Error('Usa magnitudes positivas y temperatura absoluta.');\n  if(dependent==='P')s.P=s.n*GAS_R*s.T/s.V;\n  if(dependent==='V')s.V=s.n*GAS_R*s.T/s.P;\n  if(dependent==='T')s.T=s.P*s.V/(s.n*GAS_R);\n  if(dependent==='n')s.n=s.P*s.V/(GAS_R*s.T);\n }else throw Error('Ley desconocida.');\n for(const value of Object.values(s))if(!positive(value))throw Error('Estado fuera del modelo.');\n return s;\n}\nfunction gasInvariant(law,s){return law==='boyle'?s.P*s.V:law==='charles'?s.V/s.T:law==='gay'?s.P/s.T:s.P*s.V/(s.n*s.T);}\nfunction gasPlotPoint(law,s,inverse=false){return law==='boyle'?[inverse?1/s.V:s.V,s.P]:law==='charles'?[s.T,s.V]:law==='gay'?[s.T,s.P]:[s.n*s.T,s.P*s.V];}\nfunction gasThermalSpeed(T){return Math.sqrt(3*8.31446261815324*T/0.028);}\nif(typeof module!=='undefined')module.exports={GAS_R,GAS_DEFAULT,gasSolve,gasInvariant,gasPlotPoint,gasThermalSpeed};\n\nconst $=id=>document.getElementById(id),units={P:'atm',V:'L',T:'K',n:'mol'};\nconst limits={P:{min:.2,max:5,step:.05},V:{min:LAW==='boyle'?2:1,max:LAW==='boyle'?12:20,step:.1},T:{min:150,max:600,step:1},n:{min:.05,max:.75,step:.01}};\nlet gas=gasSolve(LAW),dependent='P',samples=[{...gas}],inversePlot=false,paused=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet visualParticles=[],previousFrame=0,toastTimer;\nconst initialHTML='\u003c!doctype html>\\n'+document.documentElement.outerHTML;\nfunction f(n,d=2){if((Math.abs(n)>0&&Math.abs(n)\u003c.001)||Math.abs(n)>=1e6)return n.toExponential(2).replace('.',',');return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});}\nfunction currentDependent(){return LAW==='charles'?'V':LAW==='ideal'?dependent:'P';}\nfunction setGasValue(k,value){\n if(!Number.isFinite(value)||value\u003c=0){notify('Introduce un valor positivo; la temperatura debe estar en kelvin.');refresh();return;}\n try{gas=gasSolve(LAW,{...gas,[k]:value},dependent);refresh();}catch(error){notify(error.message);refresh();}\n}\nfunction invariantUnit(){return LAW==='boyle'?'L·atm':LAW==='charles'?'L/K':LAW==='gay'?'atm/K':'L·atm/(mol·K)';}\nfunction updateMetrics(){\n for(const k of ['P','V','T','n']){\n  $('value'+k).textContent=f(gas[k],k==='n'?3:2);\n  $('metric'+k).classList.toggle('calculated',k===currentDependent());\n  $('tag'+k).textContent=k===currentDependent()?'Calculado':LAW==='ideal'?'Control':(LAW==='boyle'&&k==='V'||(LAW==='charles'||LAW==='gay')&&k==='T')?'Control':'Constante';\n  const range=$('slider'+k),number=$('input'+k);\n  if(range){const lo=Math.min(limits[k].min,gas[k]),hi=Math.max(limits[k].max,gas[k]);range.min=lo;range.max=hi;range.value=gas[k];range.disabled=k===currentDependent();number.disabled=range.disabled;\n   if(document.activeElement!==number)number.value=Number(gas[k].toPrecision(8));\n   $('control'+k).classList.toggle('disabled',range.disabled);\n  }\n }\n $('celsius').textContent=f(gas.T-273.15,2)+' °C';\n $('rms').textContent=f(gasThermalSpeed(gas.T),0)+' m/s';\n $('invariantValue').textContent=f(gasInvariant(LAW,gas),LAW==='boyle'?4:5);\n $('comparison').textContent=LAW==='boyle'?`V/V₀ = ${f(gas.V/GAS_DEFAULT.V)} · P/P₀ = ${f(gas.P/GAS_DEFAULT.P)}. Al reducir V a la mitad, P se duplica.`:LAW==='charles'?`T/T₀ = ${f(gas.T/GAS_DEFAULT.T)} · V/V₀ = ${f(gas.V/GAS_DEFAULT.V)}. Duplicar T en kelvin duplica V.`:LAW==='gay'?`T/T₀ = ${f(gas.T/GAS_DEFAULT.T)} · P/P₀ = ${f(gas.P/GAS_DEFAULT.P)}. Duplicar T en kelvin duplica P.`:`P·V = ${f(gas.P*gas.V,4)} L·atm · n·R·T = ${f(gas.n*GAS_R*gas.T,4)} L·atm. Ambas expresiones coinciden.`;\n $('pause').textContent=paused?'▶ Animar partículas':'Ⅱ Pausar partículas';\n if(LAW==='ideal')for(const key of ['T','V','n']){const b=$('double'+key);if(b)b.disabled=dependent===key;}\n}\nfunction syncParticles(){\n const count=Math.max(8,Math.min(128,Math.round(128*gas.n/.75)));\n if(count===visualParticles.length)return;\n let seed=8471;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return(seed+.5)/4294967296;};\n visualParticles=Array.from({length:count},()=>{const a=2*Math.PI*rand(),b=Math.sqrt(-2*Math.log(rand()));return{x:.04+.92*rand(),y:.04+.92*rand(),vx:Math.cos(a)*b,vy:Math.sin(a)*b};});\n}\nfunction drawScene(dt=0){\n const canvas=$('gasScene'),c=canvas.getContext('2d'),W=620,H=370;c.clearRect(0,0,W,H);c.fillStyle='#132a31';c.fillRect(0,0,W,H);\n c.strokeStyle='#294149';c.lineWidth=.6;c.beginPath();for(let x=20;x\u003cW;x+=30){c.moveTo(x,0);c.lineTo(x,H);}for(let y=20;y\u003cH;y+=30){c.moveTo(0,y);c.lineTo(W,y);}c.stroke();\n const left=62,right=393,bottom=297,capacity=LAW==='gay'?gas.V:Math.max(LAW==='boyle'||LAW==='charles'?12:20,gas.V*1.05),height=LAW==='gay'?223:Math.max(24,223*Math.min(1,gas.V/capacity)),top=bottom-height;\n const warmth=Math.max(0,Math.min(1,(gas.T-150)/450)),red=Math.round(95+160*warmth),green=Math.round(220-65*warmth),blue=Math.round(220-110*warmth),color=`rgb(${red},${green},${blue})`;\n c.fillStyle='#1c3a42';c.fillRect(left,74,right-left,223);c.fillStyle=color;c.globalAlpha=.075;c.fillRect(left,top,right-left,height);c.globalAlpha=1;\n c.strokeStyle='#87a6aa';c.lineWidth=2;c.beginPath();c.moveTo(left,74);c.lineTo(left,bottom);c.lineTo(right,bottom);c.lineTo(right,74);c.stroke();\n const speed=Math.min(350,48*Math.sqrt(gas.T/300)),innerW=right-left-12,innerH=Math.max(5,height-14);\n for(const p of visualParticles){if(dt&&!paused){p.x+=p.vx*speed*dt/innerW;p.y+=p.vy*speed*dt/innerH;while(p.x\u003c0||p.x>1){if(p.x\u003c0){p.x=-p.x;p.vx=Math.abs(p.vx);}if(p.x>1){p.x=2-p.x;p.vx=-Math.abs(p.vx);}}while(p.y\u003c0||p.y>1){if(p.y\u003c0){p.y=-p.y;p.vy=Math.abs(p.vy);}if(p.y>1){p.y=2-p.y;p.vy=-Math.abs(p.vy);}}}\n  const x=left+6+p.x*innerW,y=top+7+p.y*innerH;c.fillS 15,1)+' °C',left,349);c.fillStyle='#a8c6bc';c.font='11px system-ui';c.fillText('n = '+f(gas.n,3)+' mol',447,311);c.fillText('Muestra visual: '+visualParticles.length+' puntos',447,331);\n}\nfunction drawGraph(){\n const all=[...samples,gas],points=all.map(s=>gasPlotPoint(LAW,s,inversePlot));let xmax,ymax,curve,xlabel,ylabel;\n if(LAW==='boyle'){\n  const k=GAS_DEFAULT.n*GAS_R*GAS_DEFAULT.T;\n  if(inversePlot){xmax=Math.max(.5,...points.map(p=>p[0]))*1.08;ymax=k*xmax*1.1;curve=x=>k*x;xlabel='1/V (L⁻¹)';}\n  else{xmax=Math.max(12,...points.map(p=>p[0]))*1.04;const lower=Math.max(.000001,Math.min(2,...all.map(s=>s.V)));ymax=Math.max(k/lower,...points.map(p=>p[1]))*1.13;curve=x=>x>0?k/x:0;xlabel='Volumen V (L)';}\n  ylabel='Presión P (atm)';\n }\n if(LAW==='charles'){xmax=Math.max(650,...points.map(p=>p[0]*1.1));curve=x=>GAS_DEFAULT.n*GAS_R*x/GAS_DEFAULT.P;ymax=curve(xmax)*1.1;xlabel='Temperatura T (K)';ylabel='Volumen V (L)';}\n if(LAW==='gay'){xmax=Math.max(650,...points.map(p=>p[0]*1.1));curve=x=>GAS_DEFAULT.n*GAS_R*x/GAS_DEFAULT.V;ymax=curve(xmax)*1.1;xlabel='Temperatura T (K)';ylabel='Presión P (atm)';}\n if(LAW==='ideal'){xmax=Math.max(150,...points.map(p=>p[0]*1.18));curve=x=>GAS_R*x;ymax=curve(xmax)*1.1;xlabel='n · T (mol·K)';ylabel='P · V (L·atm)';}\n const l=68,r=598,t=31,b=277,px=x=>l+x/xmax*(r-l),py=y=>b-y/ymax*(b-t),color=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#087f73';\n let svg=`\u003ctitle>Gráfica de ${CONFIG.title}\u003c/title>\u003cdesc>${ylabel} frente a ${xlabel}. Curva calculada con el modelo ideal y puntos de los estados registrados.\u003c/desc>\u003crect x=\"0\" y=\"0\" width=\"620\" height=\"330\" fill=\"#fffef9\"/>`;\n for(let i=0;i\u003c=5;i++){const x=l+(r-l)*i/5,y=b-(b-t)*i/5;svg+=`\u003cpath d=\"M${x} ${t}V${b} M${l} ${y}H${r}\" fill=\"none\" stroke=\"#e3e9df\" stroke-width=\"1\"/>\u003ctext x=\"${x}\" y=\"${b+19}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#657376\">${f(xmax*i/5,xmax\u003c2?2:0)}\u003c/text>\u003ctext x=\"${l-9}\" y=\"${y+3}\" text-anchor=\"end\" font-size=\"10\" fill=\"#657376\">${f(ymax*i/5,ymax\u003c1?3:2)}\u003c/text>`;}\n svg+=`\u003cpath d=\"M${l} ${t}V${b}H${r}\" fill=\"none\" stroke=\"#6a7c7a\" stroke-width=\"1.2\"/>\u003ctext x=\"${l}\" y=\"17\" font-size=\"11\" fill=\"#536561\">${ylabel}\u003c/text>\u003ctext x=\"${(l+r)/2}\" y=\"317\" text-anchor=\"middle\" font-size=\"11\" fill=\"#536561\">${xlabel}\u003c/text>`;\n let d='';const minimum=LAW==='boyle'&&!inversePlot?Math.max(.000001,Math.min(2,...all.map(s=>s.V))):0;\n for(let i=0;i\u003c=140;i++){const x=minimum+(xmax-minimum)*i/140,y=curve(x);d+=(i?'L':'M')+px(x).toFixed(3)+' '+py(y).toFixed(3)+' ';}\n svg+=`\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2.7\"/>`;\n for(let i=0;i\u003csamples.length;i++){const [x,y]=gasPlotPoint(LAW,samples[i],inversePlot);svg+=`\u003ccircle cx=\"${px(x)}\" cy=\"${py(y)}\" r=\"4\" fill=\"#fffef9\" stroke=\"${color}\" stroke-width=\"1.8\">\u003ctitle>Estado ${i+1}: ${f(x,3)}, ${f(y,4)}\u003c/title>\u003c/circle>`;}\n const [cx,cy]=gasPlotPoint(LAW,gas,inversePlot);svg+=`\u003ccircle cx=\"${px(cx)}\" cy=\"${py(cy)}\" r=\"8\" fill=\"${color}\" opacity=\".15\"/>\u003ccircle cx=\"${px(cx)}\" cy=\"${py(cy)}\" r=\"5\" fill=\"${color}\" stroke=\"#fffef9\" stroke-width=\"1.5\">\u003ctitle>Estado actual\u003c/title>\u003c/circle>`;\n $('graph').innerHTML=svg;\n if(LAW==='boyle'){$('plotMode').textContent=inversePlot?'Ver P frente a V':'Ver P frente a 1/V';$('graphDescription').textContent=inversePlot?'La recta muestra P = k·(1/V). Su pendiente es nRT. Los círculos vacíos son estados registrados; el punto lleno es el actual.':'La hipérbola muestra P = k/V. Los círculos vacíos son estados registrados; el punto lleno es el actual.';}\n}\nfunction renderTable(){\n $('tableBody').innerHTML=samples.map((s,i)=>`\u003ctr>\u003ctd>${i===0?'Inicial':`Estado ${i+1}`}\u003c/td>\u003ctd>${f(s.P,4)}\u003c/td>\u003ctd>${f(s.V,3)}\u003c/td>\u003ctd>${f(s.T,2)}\u003c/td>\u003ctd>${f(s.n,4)}\u003c/td>\u003ctd>${f(gasInvariant(LAW,s),5)}\u003c/td>\u003c/tr>`).join('');\n $('sampleCount').textContent=samples.length+' de 12 estados · valores calculados del modelo';\n}\nfunction refresh(){updateMetrics();syncParticles();drawScene();drawGraph();renderTable();}\nfunction notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}\nfor(const k of ['P','V','T','n'])if($('slider'+k)){\n $('slider'+k).addEventListener('input',e=>setGasValue(k,+e.target.value));\n $('input'+k).addEventListener('change',e=>{setGasValue(k,+e.target.value);e.target.value=Number(gas[k].toPrecision(8));});\n}\nif($('solveFor'))$('solveFor').addEventListener('change',e=>{dependent=e.target.value;gas=gasSolve(LAW,gas,dependent);refresh();});\nif($('plotMode'))$('plotMode').addEventListener('click',()=>{inversePlot=!inversePlot;drawGraph();});\n$('saveState').addEventListener('click',()=>{if(samples.some(s=>['P','V','T','n'].every(k=>Math.abs(s[k]-gas[k])\u003c1e-10))){notify('Este estado ya está registrado. Cambia una magnitud.');return;}samples.push({...gas});if(samples.length>12)samples.splice(1,1);refresh();notify('Estado registrado en la tabla y en la gráfica.');});\n$('reset').addEventListener('click',()=>{dependent='P';if($('solveFor'))$('solveFor').value='P';gas=gasSolve(LAW);samples=[{...gas}];inversePlot=false;refresh();});\n$('pause').addEventListener('click',()=>{paused=!paused;updateMetrics();drawScene();});\nfor(const key of ['T','V','n'])if($('double'+key))$('double'+key).addEventListener('click',()=>setGasValue(key,gas[key]*2));\nif($('halfV'))$('halfV').addEventListener('click',()=>setGasValue('V',gas.V/2));\n$('csv').addEventListener('click',()=>{const rows=[['Estado','P_atm','V_L','T_K','n_mol',CONFIG.invariantCSV],...samples.map((s,i)=>[i+1,s.P,s.V,s.T,s.n,gasInvariant(LAW,s)])];const csv='\\ufeff'+rows.map(row=>row.map(v=>typeof v
