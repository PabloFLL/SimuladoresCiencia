ducimos el volumen a la mitad manteniendo la temperatura?»\u003c/p>\u003c/div>\u003cdiv class=\"guide-item\">\u003cspan class=\"num\">02 / CONTRASTA\u003c/span>\u003cstrong>Cambia una sola variable\u003c/strong>\u003cp>Mantén las demás magnitudes constantes. En las leyes de los gases, registra varios estados y contrasta los valores en la gráfica.\u003c/p>\u003c/div>\u003cdiv class=\"guide-item\">\u003cspan class=\"num\">03 / EXPLICA\u003c/span>\u003cstrong>Vuelve a la predicción\u003c/strong>\u003cp>Pide que justifiquen el resultado con las medidas, la gráfica y la fórmula. Compara las condiciones de Boyle-Mariotte, Charles y Gay-Lussac.\u003c/p>\u003c/div>\u003c/section>\n\u003cdiv class=\"note\">\u003cstrong>Tu espacio para experimentar.\u003c/strong> Cada tarjeta abre un simulador. Desde él puedes volver al laboratorio, activar la pantalla completa o descargar su HTML para utilizarlo sin conexión. Los favoritos se guardan en este navegador.\u003c/div>\n\u003cfooter>\u003cspan>Laboratorio de ciencias · Física y Química\u003c/span>\u003cspan>Modelos simplificados · Controles para explorar · Explicaciones para interpretar\u003c/span>\u003c/footer>\n\u003c/div>\u003c/div>\u003c/main>\u003cscript>'use strict';\n// Add a simulator here and include its standalone HTML in dist/.\nconst SIMULATORS=[\n {id:'particulas-2d',title:'Partículas: área barrida en 2D',dimension:'2D',topic:'Materia y movimiento',level:['ESO','Bachillerato'],description:'Explora tamaño, velocidad y choques elásticos en una caja 2D. Compara el área barrida con la superficie visitada.',concepts:'particulas área superficie tamaño velocidad movimiento barrido materia',href:'particulas-2d.html'},\n {id:'particulas-3d',title:'Partículas: volumen barrido en 3D',dimension:'3D',topic:'Materia y movimiento',level:['ESO','Bachillerato'],description:'Gira la caja, sigue a las esferas y compara sus huellas. Investiga cómo el tamaño y la velocidad afectan al volumen barrido.',concepts:'particulas volumen espacio start;flex-wrap:wrap}.brand{font-size:11px}.top-actions{gap:11px}.textbutton{font-size:11px}.hero{display:block;padding:22px 0}.hero h1{font-size:33px}.hero p{font-size:13px}.hero-formula{border:0;padding:17px 0 0;min-width:0;text-align:left}.hero-formula math{display:inline-flex;font-size:27px;margin-right:12px}.hero-formula small{display:inline}.law-nav{gap:5px}.law-nav a{font-size:10px;padding:5px 8px}.constants{gap:6px}.constant-chip{font-size:10px}.lab-grid{grid-template-columns:1fr;gap:14px}.scene{aspect-ratio:620/370}.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric strong{font-size:25px}.sliders.single{grid-template-columns:1fr;gap:12px}.sliders{gap:15px}.controls-panel{padding:14px}.controls-heading{align-items:flex-start;flex-wrap:wrap}.control label{font-size:11px;flex-direction:column;align-items:stretch;gap:6px;min-height:62px}.number-wrap{justify-content:flex-start}input[type=number]{width:77px}.quick-actions{align-items:center}.invariant{gap:12px;align-items:flex-start}.invariant h2{font-size:16px}.invariant p{font-size:11px}.invariant-value{font-size:20px}.table-heading{padding:13px;flex-wrap:wrap}.table-actions{width:100%}.table-actions button{flex:1}.explanation{grid-template-columns:1fr;gap:12px}.model-note{font-size:10px}footer{flex-direction:column;gap:3px}.panel-title h2{font-size:14px}.hero-formula math[display=block]{display:inline-flex}.graph-description{min-height:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n\n:root{--accent:#5967a0;--soft:#e7e9f2}\u003c/style>\u003cscript>\n(function(){\n if(window.parent===window)return;\n document.addEventListener('click',function(event){\n  const download=event.target.closest&&event.target.closest('#download');\n  if(download){event.preventDefault();event.stopImmediatePropagation();window.parent.postMessage({labBundle:true,action:'download'},'*');return;}\n  const anchor=event.target.closest&&event.target.closest('a[href]');\n  if(!anchor||anchor.hasAttribute('download'))return;\n  const raw=anchor.getAttribute('href');\n  if(!raw)return;\n  if(raw.startsWith('#')){event.preventDefault();const target=document.getElementById(decodeURIComponent(raw.slice(1)));if(target)target.scrollIntoView();return;}\n  if(/^(https?:|mailto:|data:|blob:)/i.test(raw))return;\n  const url=new URL(raw,document.baseURI),page=url.pathname.split('/').pop();\n  if(![\"index.html\", \"gay-lussac.html\", \"leyes-gases.html\", \"gases-ideales.html\", \"particulas-2d.html\", \"particulas-3d.html\", \"charles.html\", \"boyle-mariotte.html\"].includes(page))return;\n  event.preventDefault();window.parent.postMessage({labBundle:true,action:'navigate',page,section:url.hash.slice(1)},'*');\n },true);\n})();\n\u003c/script>\u003c/head>\n\u003cbody>\u003cmain class=\"shell\">\u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"index.html\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003c/span>LABORATORIO DE CIENCIAS\u003c/a>\u003cdiv class=\"top-actions\">\u003ca class=\"textbutton\" href=\"leyes-gases.html\">← Leyes de los gases\u003c/a>\u003cbutton class=\"textbutton\" id=\"download\">Descargar HTML ↓\u003c/button>\u003cbutton class=\"textbutton\" id=\"fullscreen\">Pantalla completa ⛶\u003c/button>\u003c/div>\u003c/header>\u003cnav class=\"law-nav\" aria-label=\"Simuladores de gases\">\u003ca href=\"boyle-mariotte.html\">Boyle-Mariotte\u003c/a>\u003ca href=\"charles.html\">Charles\u003c/a>\u003ca href=\"gay-lussac.html\" aria-current=\"page\">Gay-Lussac\u003c/a>\u003ca href=\"gases-ideales.html\">Gases ideales\u003c/a>\u003c/nav>\n\u003csection class=\"hero\">\u003cdiv>\u003cspan class=\"eyebrow\">Leyes de los gases · Experimento virtual\u003c/span>\u003ch1>Ley de Gay-Lussac\u003c/h1>\u003cp>Calienta un gas en un recipiente rígido y cerrado. El volumen no cambia: observa la respuesta de la presión.\u003c/p>\u003c/div>\u003cdiv class=\"hero-formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003c/math>\u003csmall>Relación que vas a comprobar\u003c/small>\u003c/div>\u003c/section>\n\u003cdiv class=\"constants\">\u003cspan class=\"caption\">Se mantiene constante:\u003c/span>\u003cspan class=\"constant-chip\">V = 6,00 L\u003c/span>\u003cspan class=\"constant-chip\">n = 0,250 mol\u003c/span>\u003c/div>\n\u003cdiv class=\"lab-grid\">\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>El gas en el recipiente\u003c/h2>\u003cspan>Vista esquemática\u003c/span>\u003c/div>\u003ccanvas class=\"scene\" id=\"gasScene\" width=\"620\" height=\"370\" role=\"img\" aria-label=\"Partículas del gas, recipiente y manómetro. Los valores numéricos se muestran debajo.\">\u003c/canvas>\u003cdiv class=\"scene-caption\">Los puntos son una muestra visual; el dibujo y sus velocidades no están a escala.\u003c/div>\u003cdiv class=\"scene-tools\">\u003cbutton id=\"pause\">Pausar partículas\u003c/button>\u003cspan class=\"small-notice\">Rapidez típica ∝ √T\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>La relación en una gráfica\u003c/h2>\u003cspan>Curva del modelo ideal\u003c/span>\u003c/div>\u003cdiv class=\"graph-wrap\">\u003csvg id=\"graph\" viewBox=\"0 0 620 330\" role=\"img\" aria-label=\"Gráfica de Ley de Gay-Lussac\">\u003c/svg>\u003c/div>\u003cdiv class=\"graph-description\" id=\"graphDescription\">La recta muestra P = (nR/V)·T. La relación utiliza presión absoluta y kelvin, no presión manométrica ni grados Celsius.\u003c/div>\u003c/section>\u003c/div>\n\u003csection class=\"dashboard-metrics\" aria-label=\"Magnitudes del estado actual\">\u003cdiv class=\"metric\" id=\"metricP\">\u003cdiv class=\"metric-head\">Presión · P\u003cspan class=\"state-tag\" id=\"tagP\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueP\">\u003c/span> \u003csmall>atm\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Presión absoluta\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricV\">\u003cdiv class=\"metric-head\">Volumen · V\u003cspan class=\"state-tag\" id=\"tagV\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueV\">\u003c/span> \u003csmall>L\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Recipiente del estado\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricT\">\u003cdiv class=\"metric-head\">Temperatura · T\u003cspan class=\"state-tag\" id=\"tagT\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueT\">\u003c/span> \u003csmall>K\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">\u003cspan id=\"celsius\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricn\">\u003cdiv class=\"metric-head\">Cantidad de gas · n\u003cspan class=\"state-tag\" id=\"tagn\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valuen\">\u003c/span> \u003csmall>mol\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Cantidad de sustancia\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"controls-panel\" aria-label=\"Controles del experimento\">\u003cdiv class=\"controls-heading\">\u003cstrong>Modifica el estado del gas\u003c/strong>\u003cspan class=\"small-notice\">Cambia el control y observa el nuevo equilibrio.\u003c/span>\u003c/div>\u003cdiv class=\"sliders single\">\u003cdiv class=\"control\" id=\"controlT\">\u003clabel for=\"sliderT\">Temperatura \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputT\" aria-label=\"Temperatura en K\" min=\"0.000001\" step=\"any\"> K\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"sliderT\" aria-label=\"Ajustar temperatura\" step=\"any\">\u003csmall>Temperatura absoluta; 0 K no es admisible.\u003c/small>\u003c/div>\u003cdiv class=\"quick-actions\">\u003cbutton id=\"doubleT\">T × 2\u003c/button>\u003cbutton id=\"reset\">Reiniciar\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"invariant\">\u003cdiv>\u003ch2>P / T permanece constante\u003c/h2>\u003cp id=\"comparison\">\u003c/p>\u003c/div>\u003cdiv class=\"invariant-value\">\u003cspan id=\"invariantValue\">\u003c/span>\u003csmall>atm/K\u003c/small>\u003c/div>\u003c/section>\n\u003csection class=\"table-section\">\u003cdiv class=\"table-heading\">\u003cdiv>\u003ch2>Cuaderno de estados\u003c/h2>\u003cp id=\"sampleCount\">\u003c/p>\u003c/div>\u003cdiv class=\"table-actions\">\u003cbutton class=\"primary\" id=\"saveState\">+ Registrar estado\u003c/button>\u003cbutton id=\"csv\">Descargar CSV ↓\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Estado\u003c/th>\u003cth scope=\"col\">P (atm)\u003c/th>\u003cth scope=\"col\">V (L)\u003c/th>\u003cth scope=\"col\">T (K)\u003c/th>\u003cth scope=\"col\">n (mol)\u003c/th>\u003cth scope=\"col\">P/T (atm/K)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tableBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"explanation\">\u003cdiv>\u003ch2>¿Qué explica esta ley?\u003c/h2>\u003cp>A volumen y cantidad de gas constantes, la presión es directamente proporcional a la temperatura absoluta. Al calentar, aumenta la rapidez típica de las partículas y la transferencia de cantidad de movimiento a las paredes.\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003cp>Usa siempre \u003cstrong>temperatura absoluta\u003c/strong>: T(K) = t(°C) + 273,15. La presión también es absoluta. En estas unidades, R = 0,082057366 L·atm/(mol·K).\u003c/p>\u003ca class=\"source\" href=\"https://openstax.org/books/qu%C3%ADmica-2ed/pages/9-2-relaciones-entre-presion-volumen-cantidad-y-temperatura-la-ley-de-los-gases-ideales\" target=\"_blank\" rel=\"noopener\">Referencia: OpenStax · Relaciones entre P, V, n y T ↗\u003c/a>\u003c/div>\u003cdiv>\u003ch2>Una prueba para hacer en clase\u003c/h2>\u003cp>Registra el estado inicial. Duplica T de 300 K a 600 K: la presión se duplica mientras V sigue en 6 L. Registra el segundo estado y comprueba que P/T no cambia.\u003c/p>\u003cdetails>\u003csummary>Temperatura y movimiento de las partículas\u003c/summary>\u003cp>La temperatura determina la energía cinética media: ⟨E\u003csub>c\u003c/sub>⟩ = 3k\u003csub>B\u003c/sub>T/2. Las partículas no tienen todas la misma rapidez; para una masa dada, la rapidez cuadrática media crece como √T. Como referencia, para M = 28 g/mol, v\u003csub>rms\u003c/sub> = √(3RT/M) = \u003cstrong id=\"rms\">\u003c/strong> en el estado actual (aquí R = 8,314 J/(mol·K)).\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\u003cdiv class=\"model-note\">\u003cstrong>Cómo interpretar el modelo.\u003c/strong> Los valores y las curvas describen estados de equilibrio calculados con PV = nRT; no se obtienen contando los choques del dibujo. Se idealizan partículas puntuales y paredes elásticas. No se simulan los transitorios térmicos ni las interacciones de un gas real. El gas ideal es una aproximación útil a baja densidad, lejos de la condensación.\u003c/div>\n\u003cfooter>\u003ca href=\"index.html\">← Volver al laboratorio\u003c/a>\u003cspan>Leyes de los gases · Física y Química · Uso en clase y sin conexión\u003c/span>\u003c/footer>\u003c/main>\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>const LAW=\"gay\";const CONFIG={\"title\": \"Ley de Gay-Lussac\", \"slug\": \"gay-lussac\", \"invariantCSV\": \"P_sobre_T_atm_K\"};\n'use strict';\nconst GAS_R=0.08205736608096; // L atm mol^-1 K^-1\nconst GAS_DEFAULT=Object.freeze({V:6,T:300,n:0.25,P:0.25*GAS_R*300/6});\nfunction gasSolve(law,input={},dependent='P'){\n const s={...GAS_DEFAULT,...input};\n const positive=(v)=>Number.isFinite(v)&&v>0;\n if(law==='boyle'){s.T=GAS_DEFAULT.T;s.n=GAS_DEFAULT.n;if(!positive(s.V))throw Error('El volumen debe ser positivo.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='charles'){s.P=GAS_DEFAULT.P;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.V=s.n*GAS_R*s.T/s.P;}\n else if(law==='gay'){s.V=GAS_DEFAULT.V;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='ideal'){\n  if(!['P','V','T','n'].includes(dependent))throw Error('Magnitud desconocida.');\n  for(const k of ['P','V','T','n'])if(k!==dependent&&!positive(s[k]))throw Error('Usa magnitudes positivas y temperatura absoluta.');\n  if(dependent==='P')s.P=s.n*GAS_R*s.T/s.V;\n  if(dependent==='V')s.V=s.n*GAS_R*s.T/s.P;\n  if(dependent==='T')s.T=s.P*s.V/(s.n*GAS_R);\n  if(dependent==='n')s.n=s.P*s.V/(GAS_R*s.T);\n }else throw Error('Ley desconocida.');\n for(const value of Object.values(s))if(!positive(value))throw Error('Estado fuera del modelo.');\n return s;\n}\nfunction gasInvariant(law,s){return law==='boyle'?s.P*s.V:law==='charles'?s.V/s.T:law==='gay'?s.P/s.T:s.P*s.V/(s.n*s.T);}\nfunction gasPlotPoint(law,s,inverse=false){return law==='boyle'?[inverse?1/s.V:s.V,s.P]:law==='charles'?[s.T,s.V]:law==='gay'?[s.T,s.P]:[s.n*s.T,s.P*s.V];}\nfunction gasThermalSpeed(T){return Math.sqrt(3*8.31446261815324*T/0.028);}\nif(typeof module!=='undefined')module.exports={GAS_R,GAS_DEFAULT,gasSolve,gasInvariant,gasPlotPoint,gasThermalSpeed};\n\nconst $=id=>document.getElementById(id),units={P:'atm',V:'L',T:'K',n:'mol'};\nconst limits={P:{min:.2,max:5,step:.05},V:{min:LAW==='boyle'?2:1,max:LAW==='boyle'?12:20,step:.1},T:{min:150,max:600,step:1},n:{min:.05,max:.75,step:.01}};\nlet gas=gasSolve(LAW),dependent='P',samples=[{...gas}],inversePlot=false,paused=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet visualParticles=[],previousFrame=0,toastTimer;\nconst initialHTML='\u003c!doctype html>\\n'+document.documentElement.outerHTML;\nfunction f(n,d=2){if((Math.abs(n)>0&&Math.abs(n)\u003c.001)||Math.abs(n)>=1e6)return n.toExponential(2).replace('.',',');return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});}\nfunction currentDependent(){return LAW==='charles'?'V':LAW==='ideal'?dependent:'P';}\nfunction setGasValue(k,value){\n if(!Number.isFinite(value)||value\u003c=0){notify('Introduce un valor positivo; la temperatura debe estar en kelvin.');refresh();return;}\n try{gas=gasSolve(LAW,{...gas,[k]:value},dependent);refresh();}catch(error){notify(error.message);refresh();}\n}\nfunction invariantUnit(){return LAW==='boyle'?'L·atm':LAW==='charles'?'L/K':LAW==='gay'?'atm/K':'L·atm/(mol·K)';}\nfunction updateMetrics(){\n for(const k of ['P','V','T','n']){\n  $('value'+k).textContent=f(gas[k],k==='n'?3:2);\n  $('metric'+k).classList.toggle('calculated',k===currentDependent());\n  $('tag'+k).textContent=k===currentDependent()?'Calculado':LAW==='ideal'?'Control':(LAW==='boyle'&&k==='V'||(LAW==='charles'||LAW==='gay')&&k==='T')?'Control':'Constante';\n  const range=$('slider'+k),number=$('input'+k);\n  if(range){const lo=Math.min(limits[k].min,gas[k]),hi=Math.max(limits[k].max,gas[k]);range.min=lo;range.max=hi;range.value=gas[k];range.disabled=k===currentDependent();number.disabled=range.disabled;\n   if(document.activeElement!==number)number.value=Number(gas[k].toPrecision(8));\n   $('control'+k).classList.toggle('disabled',range.disabled);\n  }\n }\n $('celsius').textContent=f(gas.T-273.15,2)+' °C';\n $('rms').textContent=f(gasThermalSpeed(gas.T),0)+' m/s';\n $('invariantValue').textContent=f(gasInvariant(LAW,gas),LAW==='boyle'?4:5);\n $('comparison').textContent=LAW==='boyle'?`V/V₀ = ${f(gas.V/GAS_DEFAULT.V)} · P/P₀ = ${f(gas.P/GAS_DEFAULT.P)}. Al reducir V a la mitad, P se duplica.`:LAW==='charles'?`T/T₀ = ${f(gas.T/GAS_DEFAULT.T)} · V/V₀ = ${f(gas.  if(/^(https?:|mailto:|data:|blob:)/i.test(raw))return;\n  const url=new URL(raw,document.baseURI),page=url.pathname.split('/').pop();\n  if(![\"index.html\", \"gay-lussac.html\", \"leyes-gases.html\", \"gases-ideales.html\", \"particulas-2d.html\", \"particulas-3d.html\", \"charles.html\", \"boyle-mariotte.html\"].includes(page))return;\n  event.preventDefault();window.parent.postMessage({labBundle:true,action:'navigate',page,section:url.hash.slice(1)},'*');\n },true);\n})();\n\u003c/script>\u003c/head>\u003cbody>\u003cmain class=\"shell\">\u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"index.html\">\u003cspan class=\"mark\" aria-hidden=\"true\">\u003c/span>LABORATORIO DE CIENCIAS\u003c/a>\u003ca class=\"textbutton\" href=\"index.html\">← Todos los simuladores\u003c/a>\u003c/header>\u003csection class=\"collection-hero\">\u003cspan class=\"eyebrow\">COLECCIÓN 02 · MATERIA Y ENERGÍA\u003c/span>\u003ch1>Leyes de los gases\u003c/h1>\u003cp>Cuatro experimentos para relacionar lo que ocurre dentro del recipiente con las magnitudes que podemos medir. Modifica un control, compara estados y descubre la ley en su gráfica.\u003c/p>\u003c/section>\u003csection class=\"collection-cards\" aria-label=\"Simuladores de las leyes de los gases\">\u003ca class=\"law-card\" href=\"boyle-mariotte.html\">\u003cspan class=\"eyebrow\">EXPERIMENTO 01\u003c/span>\u003ch2>Boyle-Mariotte\u003c/h2>\u003cdiv class=\"card-equation\" style=\"color:#087f73\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003c/math>\u003c/div>\u003cp>Comprime un gas sin cambiar su temperatura. ¿Qué ocurre con la presión cuando reduces el volumen?\u003c/p>\u003cdiv class=\"card-fixed\">T = 300 K · n = 0,250 mol\u003c/div>\u003cstrong>Abrir simulador ↗\u003c/strong>\u003c/a>\u003ca class=\"law-card\" href=\"charles.html\">\u003cspan class=\"eyebrow\">EXPERIMENTO 02\u003c/span>\u003ch2>Charles\u003c/h2>\u003cdiv class=\"card-equation\" style=\"color:#ad6131\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmi>V\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003c/math>\u003c/div>\u003cp>Calienta un gas bajo un pistón que puede moverse. Mantén la presión y observa cómo aumenta el volumen.\u003c/p>\u003cdiv class=\"card-fixed\">P ≈ 1,0257 atm · n = 0,250 mol\u003c/div>\u003cstrong>Abrir simulador ↗\u003c/strong>\u003c/a>\u003ca class=\"law-card\" href=\"gay-lussac.html\">\u003cspan class=\"eyebrow\">EXPERIMENTO 03\u003c/span>\u003ch2>Gay-Lussac\u003c/h2>\u003cdiv class=\"card-equation\" style=\"color:#5967a0\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmi>P\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003c/math>\u003c/div>\u003cp>Calienta un gas en un recipiente rígido y cerrado. El volumen no cambia: observa la respuesta de la presión.\u003c/p>\u003cdiv class=\"card-fixed\">V = 6,00 L · n = 0,250 mol\u003c/div>\u003cstrong>Abrir simulador ↗\u003c/strong>\u003c/a>\u003ca class=\"law-card\" href=\"gases-ideales.html\">\u003cspan class=\"eyebrow\">EXPERIMENTO 04\u003c/span>\u003ch2>Gases ideales\u003c/h2>\u003cdiv class=\"card-equation\" style=\"color:#087b91\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>T\u003c/mi>\u003c/math>\u003c/div>\u003cp>Relaciona presión, volumen, temperatura y cantidad de gas. Elige qué magnitud calcular y modifica las otras tres.\u003c/p>\u003cdiv class=\"card-fixed\">R = 0,082057366 L·atm/(mol·K)\u003c/div>\u003cstrong>Abrir simulador ↗\u003c/strong>\u003c/a>\u003c/section>\u003csection class=\"compare\">\u003ch2>¿Qué se modifica y qué se mantiene constante?\u003c/h2>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Ley\u003c/th>\u003cth scope=\"col\">Constantes\u003c/th>\u003cth scope=\"col\">Relación\u003c/th>\u003cth scope=\"col\">Experimento\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Boyle-Mariotte\u003c/td>\u003ctd>T, n\u003c/td>\u003ctd>PV = constante\u003c/td>\u003ctd>Comprimir sin cambiar T\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Charles\u003c/td>\u003ctd>P, n\u003c/td>\u003ctd>V/T = constante\u003c/td>\u003ctd>Calentar con pistón móvil\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gay-Lussac\u003c/td>\u003ctd>V, n\u003c/td>\u003ctd>P/T = constante\u003c/td>\u003ctd>Calentar un recipiente rígido\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gases ideales\u003c/td>\u003ctd>Elige tres magnitudes\u003c/td>\u003ctd>PV = nRT\u003c/td>\u003ctd>Calcular la cuarta magnitud\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003cdiv class=\"model-note\">\u003cstrong>Antes de empezar:\u003c/strong> temperatura en kelvin y presión absoluta. Los valores son predicciones del gas ideal en equilibrio. Cada simulador incluye una gráfica, un cuaderno de estados, exportación CSV y descarga HTML para usar sin conexión.\u003c/div>\u003cfooter>\u003ca href=\"index.html\">← Volver al laboratorio\u003c/a>\u003cspan>Laboratorio de ciencias · Física y Química\u003c/span>\u003c/footer>\u003c/main>\u003c/body>\u003c/html>", "gases-ideales.html": "\u003c!doctype html>\n\u003chtml lang=\"es\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f5f3ec\">\u003cmeta name=\"description\" content=\"Simulador interactivo de Ley de los gases ideales: partículas, gráfica, tabla de estados y fórmulas para clase.\">\u003ctitle>Ley de los gases ideales · Laboratorio de ciencias\u003c/title>\u003cstyle>:root{--paper:#f5f3ec;--ink:#203136;--muted:#657376;--line:#d9ded6;--accent:#087f73;- \"gases-ideales.html\" aria-current=\"page\">Gases ideales\u003c/a>\u003c/nav>\n\u003csection class=\"hero\">\u003cdiv>\u003cspan class=\"eyebrow\">Leyes de los gases · Experimento virtual\u003c/span>\u003ch1>Ley de los gases ideales\u003c/h1>\u003cp>Relaciona presión, volumen, temperatura y cantidad de gas. Elige qué magnitud calcular y modifica las otras tres.\u003c/p>\u003c/div>\u003cdiv class=\"hero-formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>T\u003c/mi>\u003c/math>\u003csmall>Ecuación de estado\u003c/small>\u003c/div>\u003c/section>\n\u003cdiv class=\"constants\">\u003cspan class=\"caption\">Constante universal:\u003c/span>\u003cspan class=\"constant-chip\">R = 0,082057366 L·atm/(mol·K)\u003c/span>\u003c/div>\n\u003cdiv class=\"lab-grid\">\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>El gas en el recipiente\u003c/h2>\u003cspan>Vista esquemática\u003c/span>\u003c/div>\u003ccanvas class=\"scene\" id=\"gasScene\" width=\"620\" height=\"370\" role=\"img\" aria-label=\"Partículas del gas, recipiente y manómetro. Los valores numéricos se muestran debajo.\">\u003c/canvas>\u003cdiv class=\"scene-caption\">Los puntos son una muestra visual; el dibujo y sus velocidades no están a escala.\u003c/div>\u003cdiv class=\"scene-tools\">\u003cbutton id=\"pause\">Pausar partículas\u003c/button>\u003cspan class=\"small-notice\">Rapidez típica ∝ √T\u003c/span>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cdiv class=\"panel-title\">\u003ch2>La relación en una gráfica\u003c/h2>\u003cspan>Curva del modelo ideal\u003c/span>\u003c/div>\u003cdiv class=\"graph-wrap\">\u003csvg id=\"graph\" viewBox=\"0 0 620 330\" role=\"img\" aria-label=\"Gráfica de Ley de los gases ideales\">\u003c/svg>\u003c/div>\u003cdiv class=\"graph-description\" id=\"graphDescription\">Representamos PV frente a nT. Todos los estados ideales se sitúan en una recta de pendiente R, aunque cambien varias magnitudes.\u003c/div>\u003c/section>\u003c/div>\n\u003csection class=\"dashboard-metrics\" aria-label=\"Magnitudes del estado actual\">\u003cdiv class=\"metric\" id=\"metricP\">\u003cdiv class=\"metric-head\">Presión · P\u003cspan class=\"state-tag\" id=\"tagP\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueP\">\u003c/span> \u003csmall>atm\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Presión absoluta\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricV\">\u003cdiv class=\"metric-head\">Volumen · V\u003cspan class=\"state-tag\" id=\"tagV\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueV\">\u003c/span> \u003csmall>L\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Recipiente del estado\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricT\">\u003cdiv class=\"metric-head\">Temperatura · T\u003cspan class=\"state-tag\" id=\"tagT\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valueT\">\u003c/span> \u003csmall>K\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">\u003cspan id=\"celsius\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"metric\" id=\"metricn\">\u003cdiv class=\"metric-head\">Cantidad de gas · n\u003cspan class=\"state-tag\" id=\"tagn\">\u003c/span>\u003c/div>\u003cstrong>\u003cspan id=\"valuen\">\u003c/span> \u003csmall>mol\u003c/small>\u003c/strong>\u003cdiv class=\"secondary\">Cantidad de sustancia\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"controls-panel\" aria-label=\"Controles del experimento\">\u003cdiv class=\"controls-heading\">\u003cstrong>Elige la incógnita y explora\u003c/strong>\u003clabel class=\"solve-label\" for=\"solveFor\">Calcular \u003cselect id=\"solveFor\" aria-label=\"Magnitud a calcular\">\u003coption value=\"P\">P · Presión\u003c/option>\u003coption value=\"V\">V · Volumen\u003c/option>\u003coption value=\"T\">T · Temperatura\u003c/option>\u003coption value=\"n\">n · Cantidad de gas\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"sliders\">\u003cdiv class=\"control\" id=\"controlP\">\u003clabel for=\"sliderP\">Presión \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputP\" aria-label=\"Presión en atm\" min=\"0.000001\" step=\"any\"> atm\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"sliderP\" aria-label=\"Ajustar presión\" step=\"any\">\u003csmall>Valores positivos.\u003c/small>\u003c/div>\u003cdiv class=\"control\" id=\"controlV\">\u003clabel for=\"sliderV\">Volumen \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputV\" aria-label=\"Volumen en L\" min=\"0.000001\" step=\"any\"> L\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"sliderV\" aria-label=\"Ajustar volumen\" step=\"any\">\u003csmall>Valores positivos.\u003c/small>\u003c/div>\u003cdiv class=\"control\" id=\"controlT\">\u003clabel for=\"sliderT\">Temperatura \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputT\" aria-label=\"Temperatura en K\" min=\"0.000001\" step=\"any\"> K\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"sliderT\" aria-label=\"Ajustar temperatura\" step=\"any\">\u003csmall>Temperatura absoluta; 0 K no es admisible.\u003c/small>\u003c/div>\u003cdiv class=\"control\" id=\"controln\">\u003clabel for=\"slidern\">Cantidad de gas \u003cspan class=\"number-wrap\">\u003cinput type=\"number\" id=\"inputn\" aria-label=\"Cantidad de gas en mol\" min=\"0.000001\" step=\"any\"> mol\u003c/span>\u003c/label>\u003cinput type=\"range\" id=\"slidern\" aria-label=\"Ajustar cantidad de gas\" step=\"any\">\u003csmall>Valores positivos.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"quick-actions\">\u003cbutton id=\"doubleT\">T × 2\u003c/button>\u003cbutton id=\"doubleV\">V × 2\u003c/button>\u003cbutton id=\"doublen\">n × 2\u003c/button>\u003cbutton id=\"reset\">Reiniciar\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"invariant\">\u003cdiv>\u003ch2>P · V / (n · T) es igual a R\u003c/h2>\u003cp id=\"comparison\">\u003c/p>\u003c/div>\u003cdiv class=\"invariant-value\">\u003cspan id=\"invariantValue\">\u003c/span>\u003csmall>L·atm/(mol·K)\u003c/small>\u003c/div>\u003c/section>\n\u003csection class=\"table-section\">\u003cdiv class=\"table-heading\">\u003cdiv>\u003ch2>Cuaderno de estados\u003c/h2>\u003cp id=\"sampleCount\">\u003c/p>\u003c/div>\u003cdiv class=\"table-actions\">\u003cbutton class=\"primary\" id=\"saveState\">+ Registrar estado\u003c/button>\u003cbutton id=\"csv\">Descargar CSV ↓\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Estado\u003c/th>\u003cth scope=\"col\">P (atm)\u003c/th>\u003cth scope=\"col\">V (L)\u003c/th>\u003cth scope=\"col\">T (K)\u003c/th>\u003cth scope=\"col\">n (mol)\u003c/th>\u003cth scope=\"col\">PV/(nT) (L·atm/(mol·K))\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tableBody\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"explanation\">\u003cdiv>\u003ch2>¿Qué explica esta ley?\u003c/h2>\u003cp>La ecuación de estado relaciona las cuatro magnitudes de un gas ideal. No puedes fijarlas de forma independiente: al elegir tres, la cuarta queda determinada. Boyle-Mariotte, Charles y Gay-Lussac son casos particulares en los que se mantienen constantes dos magnitudes.\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003c/math>\u003cp>Usa siempre \u003cstrong>temperatura absoluta\u003c/strong>: T(K) = t(°C) + 273,15. La presión también es absoluta. En estas unidades, R = 0,082057366 L·atm/(mol·K).\u003c/p>\u003ca class=\"source\" href=\"https://openstax.org/books/qu%C3%ADmica-2ed/pages/9-2-relaciones-entre-presion-volumen-cantidad-y-temperatura-la-ley-de-los-gases-ideales\" target=\"_blank\" rel=\"noopener\">Referencia: OpenStax · Relaciones entre P, V, n y T ↗\u003c/a>\u003c/div>\u003cdiv>\u003ch2>Una prueba para hacer en clase\u003c/h2>\u003cp>Elige calcular P. Duplica T con V y n fijos: P se duplica. Reinicia y duplica V: P se reduce a la mitad. Prueba a duplicar n: P se duplica. Registra cada estado; todos cumplen PV = nRT.\u003c/p>\u003cdetails>\u003csummary>Temperatura y movimiento de las partículas\u003c/summary>\u003cp>La temperatura determina la energía cinética media: ⟨E\u003csub>c\u003c/sub>⟩ = 3k\u003csub>B\u003c/sub>T/2. Las partículas no tienen todas la misma rapidez; para una masa dada, la rapidez cuadrática media crece como √T. Como referencia, para M = 28 g/mol, v\u003csub>rms\u003c/sub> = √(3RT/M) = \u003cstrong id=\"rms\">\u003c/strong> en el estado actual (aquí R = 8,314 J/(mol·K)).\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\u003cdiv class=\"model-note\">\u003cstrong>Cómo interpretar el modelo.\u003c/strong> Los valores y las curvas describen estados de equilibrio calculados con PV = nRT; no se obtienen contando los choques del dibujo. Se idealizan partículas puntuales y paredes elásticas. No se simulan los transitorios térmicos ni las interacciones de un gas real. El gas ideal es una aproximación útil a baja densidad, lejos de la condensación.\u003c/div>\n\u003cfooter>\u003ca href=\"index.html\">← Volver al laboratorio\u003c/a>\u003cspan>Leyes de los gases · Física y Química · Uso en clase y sin conexión\u003c/span>\u003c/footer>\u003c/main>\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>const LAW=\"ideal\";const CONFIG={\"title\": \"Ley de los gases ideales\", \"slug\": \"gases-ideales\", \"invariantCSV\": \"PV_sobre_nT_L_atm_mol_K\"};\n'use strict';\nconst GAS_R=0.08205736608096; // L atm mol^-1 K^-1\nconst GAS_DEFAULT=Object.freeze({V:6,T:300,n:0.25,P:0.25*GAS_R*300/6});\nfunction gasSolve(law,input={},dependent='P'){\n const s={...GAS_DEFAULT,...input};\n const positive=(v)=>Number.isFinite(v)&&v>0;\n if(law==='boyle'){s.T=GAS_DEFAULT.T;s.n=GAS_DEFAULT.n;if(!positive(s.V))throw Error('El volumen debe ser positivo.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='charles'){s.P=GAS_DEFAULT.P;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.V=s.n*GAS_R*s.T/s.P;}\n else if(law==='gay'){s.V=GAS_DEFAULT.V;s.n=GAS_DEFAULT.n;if(!positive(s.T))throw Error('La temperatura debe ser positiva en kelvin.');s.P=s.n*GAS_R*s.T/s.V;}\n else if(law==='ideal'){\n  if(!['P','V','T','n'].includes(dependent))throw Error('Magnitud desconocida.');\n  for(const k of ['P','V','T','n'])if(k!==dependent&&!positive(s[k]))throw Error('Usa magnitudes positivas y temperatura absoluta.');\n  if(dependent==='P')s.P=s.n*GAS_R*s.T/s.V;\n  if(dependent==='V')s.V=s.n*GAS_R*s.T/s.P;\n  if(dependent==='T')s.T=s.P*s.V/(s.n*GAS_R);\n  if(dependent==='n')s.n=s.P*s.V/(GAS_R*s.T);\n }else throw Error('Ley desconocida.');\n for(const value of Object.values(s))if(!positive(value))throw Error('Estado fuera del modelo.');\n return s;\n}\nfunction gasInvariant(law,s){return law==='boyle'?s.P*s.V:law==='charles'?s.V/s.T:law==='gay'?s.P/s.T:s.P*s.V/(s.n*s.T);}\nfunction gasPlotPoint(law,s,inverse=false){return law==='boyle'?[inverse?1/s.V:s.V,s.P]:law==='charles'?[s.T,s.V]:law==='gay'?[s.T,s.P]:[s.n*s.T,s.P*s.V];}\nfunction gasThermalSpeed(T){return Math.sqrt(3*8.31446261815324*T/0.028);}\nif(typeof module!=='undefined')module.exports={GAS_R,GAS_DEFAULT,gasSolve,gasInvariant,gasPlotPoint,gasThermalSpeed};\n\nconst $=id=>document.getElementById(id),units={P:'atm',V:'L',T:'K',n:'mol'};\nconst limits={P:{min:.2,max:5,step:.05},V:{min:LAW==='boyle'?2:1,max:LAW==='boyle'?12:20,step:.1},T:{min:150,max:600,step:1},n:{min:.05,max:.75,step:.01}};\nlet gas=gasSolve(LAW),dependent='P',samples=[{...gas}],inversePlot=false,paused=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;\nlet visualParticles=[],previousFrame=0,toastTimer;\nconst initialHTML='\u003c!doctype html>\\n'+document.documentElement.outerHTML;\nfunction f(n,d=2){if((Math.abs(n)>0&&Math.abs(n)\u003c.001)||Math.abs(n)>=1e6)return n.toExponential(2).replace('.',',');return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});}\nfunction currentDependent(){return LAW==='charles'?'V':LAW==='ideal'?dependent:'P';}\nfunction setGasValue(k,value){\n if(!Number.isFinite(value)||value\u003c=0){notify('Introduce un valor positivo; la temperatura debe estar en kelvin.');refresh();return;}\n try{gas=gasSolve(LAW,{...gas,[k]:value},dependent);refresh();}catch(error){notify(error.message);refresh();}\n}\nfunction invariantUnit(){return LAW==='boyle'?'L·atm':LAW==='charles'?'L/K':LAW==='gay'?'atm/K':'L·atm/(mol·K)';}\nfunction updateMetrics(){\n for(const k of ['P','V','T','n']){\n  $('value'+k).textContent=f(gas[k],k==='n'?3:2);\n  $('metric'+k).classList.toggle('calculated',k===currentDependent());\n  $('tag'+k).textContent=k===currentDependent()?'Calculado':LAW==='ideal'?'Control':(LAW==='boyle'&&k==='V'||(LAW==='charles'||LAW==='gay')&&k==='T')?'Control':'Constante';\n  const range=$('slider'+k),number=$('input'+k);\n  if(range){const lo=Math.min(limits[k].min,gas[k]),hi=Math.max(limits[k].max,gas[k]);range.min=lo;range.max=hi;range.value=gas[k];range.disabled=k===currentDependent();number.disabled=range.disabled;\n   if(document.activeElement!==number)number.value=Number(gas[k].toPrecision(8));\n   $('control'+k).classList.toggle('disabled',range.disabled);\n  }\n }\n $('celsius').textContent=f(gas.T-273.15,2)+' °C';\n $('rms').textContent=f(gasThermalSpeed(gas.T),0)+' m/s';\n $('invariantValue').textContent=f(gasInvariant(LAW,gas),LAW==='boyle'?4:5);\n $('comparison').textContent=LAW==='boyle'?`V/V₀ = ${f(gas.V/GAS_DEFAULT.V)} · P/P₀ = ${f(gas.P/GAS_DEFAULT.P)}. Al reducir V a la mitad, P se duplica.`:LAW==='charles'?`T/T₀ = ${f(gas.T/GAS_DEFAULT.T)} · V/V₀ = ${f(gas.V/GAS_DEFAULT.V)}. Duplicar T en kelvin duplica V.`:LAW==='gay'?`T/T₀ = ${f(gas.T/GAS_DEFAULT.T)} · P/P₀ = ${f(gas.P/GAS_DEFAULT.P)}. Duplicar T en kelvin duplica P.`:`P·V = ${f(gas.P*gas.V,4)} L·atm · n·R·T = ${f(gas.n*GAS_R*gas.T,4)} L·atm. Ambas expresiones coinciden.`;\n $('pause').textContent=paused?'▶ Animar partículas':'Ⅱ Pausar partículas';\n if(LAW==='ideal')for(const key of ['T','V','n']){const b=$('double'+key);if(b)b.disabled=dependent===key;}\n}\nfunction syncParticles(){\n const count=Math.max(8,Math.min(128,Math.round(128*gas.n/.75)));\n if(count===visualParticles.length)return;\n let seed=8471;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return(seed+.5)/4294967296;};\n visualParticles=Array.from({length:count},()=>{const a=2*Math.PI*rand(),b=Math.sqrt(-2*Math.log(rand()));return{x:.04+.92*rand(),y:.04+.92*rand(),vx:Math.cos(a)*b,vy:Math.sin(a)*b};});\n}\nfunction drawScene(dt=0){\n const canvas=$('gasScene'),c=canvas.getContext('2d'),W=620,H=370;c.clearRect(0,0,W,H);c.fillStyle='#132a31';c.fillRect(0,0,W,H);\n c.strokeStyle='#294149';c.lineWidth=.6;c.beginPath();for(let x=20;x\u003cW;x+=30){c.moveTo(x,0);c.lineTo(x,H);}for(let y=20;y\u003cH;y+=30){c.moveTo(0,y);c.lineTo(W,y);}c.stroke();\n const left=62,right=393,bottom=297,capacity=LAW==='gay'?gas.V:Math.max(LAW==='boyle'||LAW==='charles'?12:20,gas.V*1.05),height=LAW==='gay'?223:Math.max(24,223*Math.min(1,gas.V/capacity)),top=bottom-height;\n const warmth=Math.max(0,Math.min(1,(gas.T-150)/450)),red=Math.round(95+160*warmth),green=Math.round(220-65*warmth),blue=Math.round(220-110*warmth),color=`rgb(${red},${green},${blue})`;\n c.fillStyle='#1c3a42';c.fillRect(left,74,right-left,223);c.fillStyle=color;c.globalAlpha=.075;c.fillRect(left,top,right-left,height);c.globalAlpha=1;\n c.strokeStyle='#87a6aa';c.lineWidth=2;c.beginPath();c.moveTo(left,74);c.lineTo(left,bottom);c.lineTo(right,bottom);c.lineTo(right,74);c.stroke();\n const speed=Math.min(350,48*Math.sqrt(gas.T/300)),innerW=right-left-12,innerH=Math.max(5,height-14);\n for(const p of visualParticles){if(dt&&!paused){p.x+=p.vx*speed*dt/innerW;p.y+=p.vy*speed*dt/innerH;while(p.x\u003c0||p.x>1){if(p.x\u003c0){p.x=-p.x;p.vx=Math.abs(p.vx);}if(p.x>1){p.x=2-p.x;p.vx=-Math.abs(p.vx);}}while(p.y\u003c0||p.y>1){if(p.y\u003c0){p.y=-p.y;p.vy=Math.abs(p.vy);}if(p.y>1){p.y=2-p.y;p.vy=-Math.abs(p.vy);}}}\n  const x=left+6+p.x*innerW,y=top+7+p.y*innerH;c.fillStyle=color;c.shadowColor=color;c.shadowBlur=7;c.beginPath();c.arc(x,y,2.8,0,2*Math.PI);c.fill();c.shadowBlur=0;}\n c.fillStyle=LAW==='gay'?'#8aabb0':'#d8e3db';c.fillRect(left-5,top-7,right-left+10,12);c.strokeStyle='#afc7c0';c.lineWidth=2;c.strokeRect(left-5,top-7,right-left+10,12);\n if(LAW!=='gay'){c.fillStyle='#7f999b';c.fillRect(218,37,18,Math.max(2,top-43));c.fillStyle='#d9e5dc';c.fillRect(194,30,67,8);}\n c.font='11px system-ui';c.fillStyle='#c3d6cf';c.fillText(LAW==='gay'?'RECIPIENTE RÍGIDO':LAW==='charles'?'PISTÓN MÓVIL · PRESIÓN CONSTANTE':'PISTÓN · VOLUMEN DEL ESTADO',left,21);\n c.font='bold 16px system-ui';c.fillStyle='#e5f5e9';c.fillText('V = '+f(gas.V)+' L',left+12,bottom-13);\n // A pressure gauge, explicitly calculated from the equilibrium equation.\n const gx=506,gy=135,gr=53,maxP=Math.max(3,Math.ceil(gas.P/3)*3),ratio=Math.min(1,gas.P/maxP);\n c.strokeStyle='#628285';c.lineWidth=2;c.beginPath();c.arc(gx,gy,gr,Math.PI*.75,Math.PI*2.25);c.stroke();\n for(let i=0;i\u003c=6;i++){const a=Math.PI*.75+1.5*Math.PI*i/6;c.strokeStyle='#8caaa7';c.lineWidth=1;c.beginPath();c.moveTo(gx+Math.cos(a)*(gr-5),gy+Math.sin(a)*(gr-5));c.lineTo(gx+Math.cos(a)*gr,gy+Math.sin(a)*gr);c.stroke();}\n const angle=Math.PI*.75+ratio*1.5*Math.PI;c.strokeStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+Math.cos(angle)*39,gy+Math.sin(angle)*39);c.stroke();c.fillStyle=color;c.beginPath();c.arc(gx,gy,5,0,2*Math.PI);c.fill();\n c.font='10px system-ui';c.fillStyle='#a7c5be';c.fillText('0',gx-43,gy+48);c.textAl =\"vB\" type=\"range\" min=\"1\" max=\"240\" step=\"1\" value=\"40\">\u003c/div>\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv>\u003cdiv class=\"metric-name\">Área barrida · con repeticiones\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"sweptB\">0\u003c/span> \u003csmall>u²\u003c/small>\u003c/div>\u003cdiv class=\"reference-line\">Sin choques: \u003cspan id=\"referenceB\">0\u003c/span> u² · Choques: \u003cspan id=\"hitsB\">0\u003c/span>\u003c/div>\u003cdiv class=\"reference-line\">Energía cinética: \u003cspan id=\"energyB\">100,0\u003c/span> % de la inicial\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"metric-name\">Superficie cubierta · sin repetir\u003c/div>\u003cdiv class=\"metric-value\">\u003cspan id=\"coveredB\">0,0\u003c/span> \u003csmall>% de la caja\u003c/small>\u003c/div>\u003cdiv class=\"meter\">\u003cspan id=\"meterB\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/article>\n\u003c/section>\n\u003cdiv class=\"below-panels\">\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"balance\" checked>Compensar velocidades iniciales: d\u003csub>A\u003c/sub> · v\u003csub>A\u003c/sub> = d\u003csub>B\u003c/sub> · v\u003csub>B\u003c/sub>\u003c/label>\u003cdiv style=\"display:flex;gap:20px\">\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"trail\" checked>Ver huella\u003c/label>\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"collisions\" checked>Choques elásticos\u003c/label>\u003clabel class=\"checklabel\">\u003cinput type=\"checkbox\" id=\"arrows\" checked>Ver dirección\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"collision-settings\">\u003clabel for=\"collisionModel\">Modelo de choque \u003cselect id=\"collisionModel\">\u003coption value=\"exchange\" selected>Comparación exacta · didáctico\u003c/option>\u003coption value=\"smooth\">Esferas lisas · choque oblicuo\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"randomize\" title=\"Sortea direcciones nuevas y reinicia ambas cajas\">↻ Nuevas direcciones\u003c/button>\u003cspan>Reiniciar repite las mismas direcciones en ambas cajas.\u003c/span>\u003c/div>\n\u003cp class=\"collision-note\" id=\"collisionNote\">Los choques redistribuyen las velocidades. El barrido real se calcula con el recorrido de cada partícula; «Sin choques» muestra la referencia inicial. Desactiva los choques para recuperar la comparación original.\u003c/p>\n\u003csection class=\"transport\" aria-label=\"Reproducción\">\u003cdiv class=\"transport-left\">\u003cbutton class=\"primary\" id=\"play\">▶ Iniciar\u003c/button>\u003cbutton id=\"step\" title=\"Avanzar un segundo simulado\">+1 s\u003c/button>\u003cbutton id=\"reset\">↺ Reiniciar\u003c/button>\u003c/div>\u003cdiv class=\"time-info\">\u003cdiv class=\"clock\">\u003cspan id=\"time\">0,0\u003c/span> \u003csmall>s\u003c/small>\u003c/div>\u003cdiv class=\"time-track\" role=\"progressbar\" aria-label=\"Tiempo del experimento\" aria-valuemin=\"0\" aria-valuemax=\"20\" aria-valuenow=\"0\" id=\"timeProgress\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\u003clabel class=\"duration\" for=\"duration\">Duración \u003cselect id=\"duration\">\u003coption value=\"10\">10 s\u003c/option>\u003coption value=\"20\" selected>20 s\u003c/option>\u003coption value=\"40\">40 s\u003c/option>\u003coption value=\"60\">60 s\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class=\"duration\" for=\"playback\">Reproducción \u003cselect id=\"playback\">\u003coption value=\"0.5\">×0,5\u003c/option>\u003coption value=\"1\" selected>×1\u003c/option>\u003coption value=\"2\">×2\u003c/option>\u003c/select>\u003c/label>\u003c/section>\n\u003csection class=\"result\" aria-live=\"polite\" aria-atomic=\"true\">\u003cdiv>\u003ch2 id=\"resultTitle\">Mismo barrido por segundo\u003c/h2>\u003cp id=\"resultText\">A tiene 1/3 del diámetro de B y se mueve 3 veces más rápido.\u003c/p>\u003c/div>\u003cdiv class=\"ratio\">\u003csmall>Barrido real A / B\u003c/small>\u003cspan id=\"ratio\">1,00\u003c/span>×\u003c/div>\u003c/section>\n\u003csection class=\"physics-explainer\" aria-labelledby=\"physics-title\">\n\u003cdiv class=\"physics-intro\">\u003cspan class=\"smalltag\">Del modelo al gas real\u003c/span>\u003ch2 id=\"physics-title\">¿El diámetro fija la velocidad?\u003c/h2>\u003cp>\u003cstrong>No hay una rapidez fija para cada diámetro.\u003c/strong> En un gas en equilibrio térmico hay una distribución de rapideces (Maxwell-Boltzmann). Los choques las redistribuyen; a temperatura constante, la rapidez media se mantiene aproximadamente estable, con fluctuaciones.\u003c/p>\u003c/div>\n\u003cdiv class=\"physics-equations\">\n\u003carticle class=\"physics-equation\">\u003ch3>Temperatura y masa\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"La rapidez media es proporcional a la raíz cuadrada de la temperatura dividida por la masa\">\u003cmover>\u003cmi>v\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>∝\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmi>T\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/math>\u003cp>A igual temperatura, las partículas menos masivas se mueven más rápido \u003cstrong>en promedio\u003c/strong>.\u003c/p>\u003csmall>T: temperatura en kelvin · m: masa · v̄: rapidez media.\u003c/small>\u003c/article>\n\u003carticle class=\"physics-equation\">\u003ch3>Si son esferas de igual densidad\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"Masa proporcional al diámetro al cubo; a temperatura y densidad constantes, rapidez media proporcional al inverso del diámetro elevado a tres medios\">\u003cmi>m\u003c/mi>\u003cmo>∝\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>⇒\u003c/mo>\u003cmover>\u003cmi>v\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>∝\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmfrac>\u003cmn>3\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/msup>\u003c/mfrac>\u003c/math>\u003cp>Esta relación se deduce para \u003cstrong>esferas físicas en 3D\u003c/strong>, con la misma densidad y temperatura.\u003c/p>\u003csmall>No es una ley universal entre diámetro molecular y rapidez.\u003c/small>\u003c/article>\n\u003carticle class=\"physics-equation\">\u003ch3>¿Qué conservan los choques?\u003c/h3>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"La energía cinética de una partícula es un medio de su masa por su rapidez al cuadrado\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmi>m\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003cp>Un choque elástico conserva la \u003cstrong>energía total del par\u003c/strong> y su cantidad de movimiento, aunque cambien las rapideces individuales.\u003c/p>\u003csmall>Conservar la energía no obliga a conservar la suma de rapideces ni el barrido.\u003c/small>\u003c/article>\n\u003c/div>\n\u003cp class=\"physics-model-note\">\u003cstrong>En este simulador:\u003c/strong> diámetro y rapidez inicial se eligen por separado; no se calcula una temperatura ni se vincula la masa al tamaño. «Comparación exacta» es una idealización elegida para igualar el barrido. «Esferas lisas» permite que las rapideces cambien con los choques. Las fórmulas anteriores son la referencia física, no relaciones impuestas por el programa.\u003c/p>\n\u003ca class=\"physics-source\" href=\"https://openstax.org/books/qu%C3%ADmica-2ed/pages/9-5-la-teoria-cinetico-molecular\" target=\"_blank\" rel=\"noopener noreferrer\">Fundamento: teoría cinético-molecular · OpenStax ↗\u003c/a>\n\u003c/section>\n\u003csection class=\"learning\">\u003cdiv class=\"learning-card\">\u003cstrong>¿Por qué pueden barrer lo mismo?\u003c/strong>\u003cp>Al moverse, cada disco dibuja una franja tan ancha como su diámetro. Menos anchura puede compensarse con más recorrido: si el diámetro se divide entre 3, la velocidad debe multiplicarse por 3.\u003c/p>\u003cdetails>\u003csummary>Ver el modelo y sus límites\u003c/summary>\u003cp>La referencia sin choques es N · d · v · t: suma el avance de las franjas aunque vuelvan a pasar por el mismo sitio. En un trayecto recto aislado, incluyendo el disco inicial, el área es d · v · t + π(d/2)².\u003c/p>\u003cp>La superficie cubierta mide la unión de las huellas en la caja; incluye los discos iniciales y cuenta cada punto una sola vez. Se estima sobre píxeles, por lo que es aproximada. Los cruces y rebotes hacen que no coincida exactamente entre cajas.\u003c/p>\u003cp>Las partículas rebotan en las paredes y, con la opción activada, chocan elásticamente entre ellas. En cada caja tienen igual masa. Ambos modelos conservan la energía cinética y la cantidad de movimiento del par. En «Comparación exacta» se intercambian los vectores de velocidad completos: la suma de rapideces se mantiene y el barrido coincide con la fórmula. Es una idealización didáctica y no representa el choque oblicuo general de esferas lisas. En «Esferas lisas» se intercambia solo la componente normal al contacto: las rapideces pueden redistribuirse y el barrido puede diferir sin pérdida de energía. El barrido mostrado siempre suma los recorridos efectivamente realizados. La referencia usa las rapideces iniciales constantes. Las dos cajas usan las mismas posiciones y direcciones aleatorias iniciales de sus centros. «Nuevas direcciones» sortea otro conjunto; «Reiniciar» repite el actual. Las unidades son arbitrarias. Es una comparación geométrica: no representa una ley que relacione automáticamente el tamaño molecular con la velocidad.\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"learning-card\">\u003cstrong>Prueba en clase\u003c/strong>\u003cp>1. Inicia «Mismo barrido» con el modelo «Comparación exacta». Comprueba la igualdad del barrido incluso con choques.\u003cbr>2. Prueba «Misma velocidad»: ¿qué caja barre más?\u003cbr>3. Cambia a «Esferas lisas»: ¿puede cambiar el barrido sin perder energía? Observa el indicador de energía cinética.\u003c/p>\u003cp style=\"margin-top:9px\">El color muestra la zona visitada; los discos marcan dónde están las partículas ahora. Al cambiar tamaños, velocidades, cantidad o caja, el experimento vuelve al inicio.\u003c/p>\u003c/div>\u003c/section>\n\u003cfooter>\u003cspan>Laboratorio de partículas · Modelo didáctico bidimensional\u003c/span>\u003cspan>u = unidad de longitud · u² = unidad de área\u003c/span>\u003c/footer>\n\u003c/main>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>\n'use strict';\nconst initialHTML='\u003c!doctype html>\\n'+document.documentElement.outerHTML;\nconst $=id=>document.getElementById(id);\nconst fmt=(n,d=0)=>n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst state={width:600,height:360,count:3,dA:12,dB:36,vA:120,vB:40,t:0,duration:20,running:false,locked:true,showTrail:true,arrows:true,playback:1,collisions:true,collisionModel:'exchange',seed:Math.floor(Math.random()*4294967296)};\nconst panels={};let last=0,accumulator=0,coverageClock=0,toastTimer;\n/* PHYSICS_START */\n// Equal-mass hard disks/spheres. Events are solved in continuous time so fast\n// particles cannot jump through one another between rendered frames.\nfunction syncParticle(p,axes){\n p.speed=Math.hypot(...axes.map(a=>p['v'+a]));\n for(const a of axes)p['d'+a]=p.speed>1e-12?p['v'+a]/p.speed:0;\n}\nfunction advanceParticles(particles,dt,r,dims,collisions,onSegment,onCollision=()=>{},model='smooth'){\n const axes=['x','y','z'].slice(0,dims.length),diameter=2*r,contactTolerance=1e-6;\n let remaining=dt,iterations=0;\n for(const p of particles)syncParticle(p,axes);\n while(remaining>1e-12){\n  if(++iterations>10000)throw Error('Too many contact events in one step');\n  let eventTime=remaining,hasEvent=false;\n  for(const p of particles)for(let axis=0;axis\u003caxes.length;axis++){\n   const a=axes[axis],v=p['v'+a];if(Math.abs(v)\u003c1e-12)continue;\n   const t=((v>0?dims[axis]-r:r)-p[a])/v;\n   if(t>=-1e-10&&t\u003c=eventTime){eventTime=Math.max(0,t);hasEvent=true;}\n  }\n  if(collisions)for(let i=0;i\u003cparticles.length;i++)for(let j=i+1;j\u003cparticles.length;j++){\n   const p=particles[i],q=particles[j];let aa=0,b=0,c=-diameter*diameter;\n   for(const a of axes){const delta=q[a]-p[a],v=q['v'+a]-p['v'+a];aa+=v*v;b+=delta*v;c+=delta*delta;}\n   if(aa\u003c1e-18||b>=-1e-9)continue;\n   const discriminant=b*b-aa*c;if(discriminant\u003c=0)continue;\n   // Stable near-contact form of the smaller quadratic root.\n   const t=Math.max(0,c)/(-b+Math.sqrt(discriminant));\n   if(t\u003c=eventTime){eventTime=t;hasEvent=true;}\n  }\n  if(eventTime>0){\n   for(const p of particles){const start={};for(const a of axes){start[a]=p[a];p[a]+=p['v'+a]*eventTime;}onSegment(p,start,Object.fromEntries(axes.map(a=>[a,p[a]])),p.speed*eventTime);}\n   remaining=Math.max(0,remaining-eventTime);\n  }\n  if(!hasEvent)break;\n  let resolved=false;\n  // Sequential impulses also handle a wall and a pair contact at the same time.\n  for(let pass=0;pass\u003c12;pass++){\n   let changed=false;\n   for(const p of particles)for(let axis=0;axis\u003caxes.length;axis++){\n    const a=axes[axis],v='v'+a;\n    if((p[a]\u003c=r+contactTolerance&&p[v]\u003c0)||(p[a]>=dims[axis]-r-contactTolerance&&p[v]>0)){p[v]=-p[v];changed=resolved=true;}\n    p[a]=Math.max(r,Math.min(dims[axis]-r,p[a]));\n   }\n   if(collisions)for(let i=0;i\u003cparticles.length;i++)for(let j=i+1;j\u003cparticles.length;j++){\n    const p=particles[i],q=particles[j],delta=axes.map(a=>q[a]-p[a]),distance=Math.hypot(...delta);\n    if(distance>diameter+contactTolerance||distance\u003c1e-12)continue;\n    const normal=delta.map(v=>v/distance);let relative=0;\n    for(let axis=0;axis\u003caxes.length;axis++){const a=axes[axis];relative+=(q['v'+a]-p['v'+a])*normal[axis];}\n    if(relative>=-1e-9)continue;\n    if(model==='exchange'){\n     // Didactic exchange rule: conserves linear momentum, kinetic energy and\n     // the set of speeds. It is not a general smooth-sphere oblique impulse.\n     for(const a of axes){const v=p['v'+a];p['v'+a]=q['v'+a];q['v'+a]=v;}\n    }else{\n     for(let axis=0;axis\u003caxes.length;axis++){const a=axes[axis],impulse=relative*normal[axis];p['v'+a]+=impulse;q['v'+a]-=impulse;}\n    }\n    changed=resolved=true;onCollision(p,q);\n   }\n   if(!changed)break;\n  }\n  for(const p of particles)syncParticle(p,axes);\n  if(!resolved&&eventTime===0)throw Error('Unresolved particle contact');\n }\n}\n/* PHYSICS_END */\nfunction seeded(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}\nfunction rate(k){return state.count*state['d'+k]*state['v'+k];}\nfunction configurePanel(k){\n const c=$('canvas'+k);c.width=state.width;c.height=state.height;\n const mask=document.createElement('canvas');mask.width=state.width;mask.height=state.height;\n const m=mask.getContext('2d',{willReadFrequently:true});\n const rnd=seeded(state.seed),particles=[];\n const startPositions=[[.32,.48],[.68,.48],[.78,.20],[.25,.80],[.50,.20],[.85,.80]];\n for(let i=0;i\u003cstate.count;i++){const a=rnd()*Math.PI*2;particles.push({x:startPositions[i][0]*state.width,y:startPositions[i][1]*state.height,dx:Math.cos(a),dy:Math.sin(a)});}\n const p=panels[k]={canvas:c,ctx:c.getContext('2d'),mask,m,particles,color:k==='A'?'#53dfbe':'#ffb77e',covered:0,swept:0,collisionCount:0};\n for(const q of particles){q.vx=q.dx*state['v'+k];q.vy=q.dy*state['v'+k];syncParticle(q,['x','y']);}\n m.fillStyle=p.color;m.strokeStyle=p.color;m.lineWidth=state['d'+k];m.lineCap='round';m.lineJoin='round';\n for(const q of particles){m.beginPath();m.arc(q.x,q.y,state['d'+k]/2,0,2*Math.PI);m.fill();}\n}\nfunction compensate(){if(state.locked)state.vB=state.dA*state.vA/state.dB;}\nfunction reset(){state.t=0;state.running=false;accumulator=0;coverageClock=0;configurePanel('A');configurePanel('B');measureCoverage();updateControls();updateNumbers();draw();}\nfunction measureCoverage(){for(const k of ['A','B']){const p=panels[k],px=p.m.getImageData(0,0,state.width,state.height).data;let count=0;for(let i=3;i\u003cpx.length;i+=4)if(px[i]>=128)count++;p.covered=100*count/(state.width*state.height);}}\nfunction tick(dt){\n const delta=Math.min(dt,Math.max(0,state.duration-state.t));if(delta\u003c=0)return;\n for(const k of ['A','B']){const p=panels[k],r=state['d'+k]/2;advanceParticles(p.particles,delta,r,[state.width,state.height],state.collisions,(q,a,b,length)=>{p.swept+=state['d'+k]*length;p.m.beginPath();p.m.moveTo(a.x,a.y);p.m.lineTo(b.x,b.y);p.m.stroke();},()=>p.collisionCount++,state.collisionModel);}\n state.t=Math.min(state.duration,state.t+delta);coverageClock+=delta;\n if(coverageClock>=.16 || state.t>=state.duration-1e-8){measureCoverage();coverageClock=0;}\n if(state.t>=state.duration-1e-8){state.t=state.duration;state.running=false;updateControls();}\n}\nfunction draw(){\n for(const k of ['A','B']){\n  const p=panels[k],c=p.ctx,w=state.width,h=state.height,r=state['d'+k]/2;c.clearRect(0,0,w,h);c.fillStyle='#132a31';c.fillRect(0,0,w,h);\n  c.strokeStyle='#2a4248';c.lineWidth=.65;c.beginPath();for(let x=40;x\u003cw;x+=40){c.moveTo(x,0);c.lineTo(x,h);}for(let y=40;y\u003ch;y+=40){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();\n  if(state.showTrail){c.globalAlpha=.25;c.drawImage(p.mask,0,0);c.globalAlpha=1;}\n  for(const q of p.particles){\n   if(state.arrows){const len=Math.min(70,Math.max(18,q.speed*.23)),sx=q.x+q.dx*(r+4),sy=q.y+q.dy*(r+4),ex=sx+q.dx*len,ey=sy+q.dy*len;c.strokeStyle=p.color;c.globalAlpha=.65;c.lineWidth=1.3;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.moveTo(ex-q.dx*6-q.dy*4,ey-q.dy*6+q.dx*4);c.lineTo(ex,ey);c.lineTo(ex-q.dx*6+q.dy*4,ey-q.dy*6-q.dx*4);c.stroke();c.globalAlpha=1;}\n   c.shadowColor=p.color;c.shadowBlur=14;c.fillStyle=p.color;c.beginPath();c.arc(q.x,q.y,r,0,2*Math.PI);c.fill();c.shadowBlur=0;c.strokeStyle='#ffffff9c';c.lineWidth=1;c.stroke();c.fillStyle='#ffffffa0';c.beginPath();c.arc(q.x-r*.28,q.y-r*.28,Math.max(1,r*.18),0,2*Math.PI);c.fill();\n  }\n }\n}\nfunction updateControls(){\n for(const k of ['A','B']){for(const type of ['d','v']){const val=state[type+k];if(type==='v'&&k==='B')$('vB').max=Math.max(240,Math.ceil(val));$(type+k).value=val;$(type+k+'o').innerHTML=fmt(val,Number.isInteger(val)?0:1)+' \u003csmall>'+ (type==='d'?'u':'u/s')+'\u003c/small>';}\n $('rate'+k).textContent='Barrido: '+fmt(rate(k))+' u²/s';}\n $('collisions').checked=state.collisions;$('collisionNote').hidden=!state.collisions;$('collisionModel').value=state.collisionModel;$('collisionModel').disabled=!state.collisions;$('balance').checked=state.locked;$('play').textContent=state.running?'Ⅱ Pausar':state.t>=state.duration?'▶ Repetir':state.t>0?'▶ Continuar':'▶ Iniciar';$('step').disabled=state.running||state.t>=state.duration;\n document.querySelectorAll('.box-dims').forEach(x=>x.textContent=state.width+' × '+state.height+' u');\n const ratio=rate('A')/rate('B');$('ratio').textContent=fmt(ratio,2);\n const eq=Math.abs(ratio-1)\u003c.000001;\n $('resultTitle').textContent=(state.collisions&&state.collisionModel==='smooth'?'Referencia inicial: ':'')+(eq?'Mismo barrido por segundo':ratio>1?'A barre más área por segundo':'B barre más área por segundo');\n if(eq){const d=state.dB/state.dA,v=state.vA/state.vB;$('resultText').textContent=Math.abs(d-3)\u003c1e-8?'A tiene 1/3 del diámetro de B y se mueve 3 veces más rápido.':'Diámetro × velocidad coincide en ambas cajas: '+fmt(state.dA)+' × '+fmt(state.vA,1)+' = '+fmt(state.dB)+' × '+fmt(state.vB,1)+'.';}\n else{$('resultText').textContent='El barrido de '+(ratio>1?'A':'B')+' es '+fmt(ratio>1?ratio:1/ratio,2)+' veces el de '+(ratio>1?'B':'A')+'. Compara también cuánto se solapan las huellas.';}\n if(state.collisions&&state.collisionModel==='smooth')$('resultText').textContent='Al inicio: '+$('resultText').textContent;\n updateCollisionNumbers();\n}\nfunc
